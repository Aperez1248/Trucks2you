let S = seed();
let ui = { role: "contractor", tab: "jobs", view: null, draft: null, applicant: null };

const $ = (s, el = document) => el.querySelector(s);
const money = n => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = n => "$" + Math.round(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const job = id => S.jobs.find(j => j.id === id);
const needed = j => Object.values(j.needs).reduce((a, b) => a + b, 0);
const filled = (j, t) => j.assignments.filter(a => !t || a.type === t).length;
const tons = a => a.tickets.reduce((s, t) => s + t.tons, 0);
const billOf = (j, a) => (a.hours || 0) * j.rate[a.type];
const jobBill = j => j.assignments.reduce((s, a) => s + billOf(j, a), 0);
const allDone = j => j.assignments.length > 0 && j.assignments.every(a => a.status === "done");

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2400);
}

function statusPill(a) {
  if (a.status === "done") return '<span class="pill good">Checked out</span>';
  if (a.status === "onsite") return '<span class="pill info">On the clock</span>';
  return '<span class="pill warn">Assigned</span>';
}

function route(j) {
  return `<div class="route"><span class="dot"></span><span>${esc(j.pickup)}</span><span class="line"></span><span></span><span class="dot end"></span><span>${esc(j.dropoff)}</span></div>`;
}

function jobFillChips(j) {
  return Object.keys(TYPES).filter(t => j.needs[t]).map(t =>
    `<span class="chip">${TYPES[t].short} ${filled(j, t)}/${j.needs[t]}</span>`).join("");
}

/* ---------- Dispatch info (job notes for drivers) ---------- */
const DSP_FIELDS = [["contact", "On-site contact"], ["phone", "Contact phone"], ["staging", "Staging spot"], ["gate", "Gate and access"],
  ["order", "Plant order or ticket #"], ["mix", "Material or mix"], ["ppe", "Safety gear"], ["notes", "Other notes"]];
const anyJob = id => job(id) || (S.broker && S.broker.jobs.find(j => j.id === id));
const dsp = j => (j.dsp ||= { notes: j.notes || "" });
const updatesOf = j => (j.updates ||= []);
const unreadFor = (j, truck) => updatesOf(j).filter(u => !u.readBy.includes(truck));
function dspList(j) {
  const d = dsp(j), rows = DSP_FIELDS.filter(([k]) => d[k]);
  return rows.length ? `<div class="sum">${rows.map(([k, label]) => `<div class="row" style="align-items:flex-start"><span class="muted" style="flex:none;width:40%">${label}</span><span style="text-align:right${k === "phone" ? ";user-select:all" : ""}">${esc(d[k])}</span></div>`).join("")}</div>` : '<p class="muted">No dispatch info yet.</p>';
}
function dspEditor(j, drivers) {
  if (ui.dspEdit === j.id) return `<div class="card"><h2>Edit dispatch info</h2>
    ${DSP_FIELDS.map(([k, label]) => `<label class="field">${label}${k === "notes" ? `<textarea id="d-${k}" rows="3">${esc(dsp(j)[k] || "")}</textarea>` : `<input id="d-${k}" value="${esc(dsp(j)[k] || "")}">`}</label>`).join("")}
    <div class="row" style="gap:8px"><button class="btn small" type="button" data-act="dsp-save:${j.id}" style="flex:1">Save and notify drivers</button><button class="btn small ghost" type="button" data-act="dsp-cancel" style="flex:1">Cancel</button></div></div>`;
  const ups = updatesOf(j);
  return `<div class="card"><div class="row"><h2>Dispatch info for drivers</h2><button class="btn small ghost" type="button" data-act="dsp-edit:${j.id}">Edit</button></div>
    ${dspList(j)}
    <div class="stack" style="gap:6px;border-top:1px solid var(--line);padding-top:10px"><strong style="font-size:14px">Send an update to every driver on this job</strong>
      <textarea id="d-msg" rows="2" placeholder="e.g. Plant is down 30 minutes. Hold at staging."></textarea>
      <button class="btn small" type="button" data-act="dsp-send:${j.id}" style="justify-self:start">Send to ${drivers} driver${drivers === 1 ? "" : "s"}</button></div>
    ${ups.length ? `<div class="list">${ups.slice().reverse().map(u => `<div><div class="row"><span class="eyebrow">${esc(u.time)}</span>${j.assignments ? `<span class="muted num" style="font-size:12px">Read by ${u.readBy.length} of ${drivers}</span>` : '<span class="muted" style="font-size:12px">Sent by text</span>'}</div><p style="font-size:14px">${esc(u.text)}</p></div>`).join("")}</div>` : ""}</div>`;
}
function dspDriverCard(j, truck) {
  const unread = unreadFor(j, truck), ups = updatesOf(j);
  return `<div class="card" style="${unread.length ? "border:2px solid var(--warn)" : ""}"><div class="row"><h2>Dispatch info</h2>${unread.length ? `<span class="pill warn">${unread.length} new</span>` : ""}</div>
    ${ups.length ? `<div class="list">${ups.slice().reverse().map(u => { const isNew = !u.readBy.includes(truck); return `<div class="stack" style="gap:6px"><div class="row"><span class="eyebrow">${esc(u.time)} · from dispatch</span>${isNew ? '<span class="pill warn">New</span>' : ""}</div><p style="font-size:14px${isNew ? ";font-weight:600" : ""}">${esc(u.text)}</p></div>`; }).join("")}</div>
      ${unread.length ? `<button class="btn small" type="button" data-act="dsp-ack:${j.id}:${truck}" style="justify-self:start">Got it</button>` : ""}` : ""}
    <div style="${ups.length ? "border-top:1px solid var(--line);padding-top:10px" : ""}">${dspList(j)}</div></div>`;
}

/* ---------- Contractor ---------- */
function contractorJobs() {
  const active = S.jobs.filter(j => !j.approved);
  const done = S.jobs.filter(j => j.approved);
  const card = j => {
    const pct = Math.round(100 * filled(j) / Math.max(1, needed(j)));
    let pill = filled(j) >= needed(j) ? '<span class="pill good">Fully booked</span>' : '<span class="pill warn">Finding trucks</span>';
    if (allDone(j) && !j.approved) pill = '<span class="pill info">Ready to approve</span>';
    if (j.approved) pill = '<span class="pill good">Approved</span>';
    return `<button type="button" class="card tap" data-go="job:${j.id}">
      <div class="row"><span class="eyebrow">${esc(j.date)} · ${esc(j.start)}</span>${pill}</div>
      <h2>${esc(j.name)}</h2>
      <p class="muted" style="font-size:14px">${esc(j.kind)}</p>
      <div class="meter" aria-label="${pct}% of trucks booked"><i style="width:${pct}%"></i></div>
      <div class="row"><div class="chips">${jobFillChips(j)}</div><span class="muted num" style="font-size:13px">${filled(j)} of ${needed(j)} trucks</span></div>
    </button>`;
  };
  return `<div class="row"><h1>Your jobs</h1><button class="btn small" type="button" data-act="new-job">+ Post a job</button></div>
    ${active.map(card).join("")}
    ${done.length ? `<p class="eyebrow">Approved and billed</p>${done.map(card).join("")}` : ""}`;
}

function contractorJob(j) {
  const ready = allDone(j);
  const bill = jobBill(j);
  const assignRows = j.assignments.map(a => `
    <div class="stack" style="gap:6px">
      <div class="row"><div class="row" style="justify-content:flex-start"><span class="truck-ic">${TYPES[a.type].short}</span>
        <div><strong>${esc(a.truck)} · ${esc(a.owner)}</strong><div class="muted" style="font-size:13px">${TYPES[a.type].name}${a.checkIn ? " · in at " + esc(a.checkIn) : ""}</div></div></div>
        ${statusPill(a)}</div>
      ${a.tickets.length ? `<div class="muted num" style="font-size:13px">${a.tickets.length} load ticket${a.tickets.length > 1 ? "s" : ""} · ${tons(a).toFixed(1)} t${a.hours ? " · " + a.hours + " hrs" : ""}</div>` : ""}
    </div>`).join("");
  const tickets = j.assignments.flatMap(a => a.tickets.map(t => ({ ...t, truck: a.truck })));
  const open = Object.keys(TYPES).filter(t => j.needs[t] > filled(j, t)).map(t => `${j.needs[t] - filled(j, t)} × ${TYPES[t].name}`);
  return `<button class="back" type="button" data-go="back">‹ All jobs</button>
    <div class="stack" style="gap:4px"><span class="eyebrow">${esc(j.id)} · ${esc(j.date)} · start ${esc(j.start)}</span><h1>${esc(j.name)}</h1><p class="muted">${esc(j.kind)}</p></div>
    <div class="card">${route(j)}</div>
    ${dspEditor(j, j.assignments.length)}
    ${j.assignments.length ? (() => { const loads = j.assignments.reduce((s, a) => s + a.tickets.length, 0), tn = j.assignments.reduce((s, a) => s + tons(a), 0), on = j.assignments.filter(a => a.status === "onsite").length;
      return `<div class="stats"><div class="stat"><span>Loads</span><div class="big">${loads}</div></div><div class="stat"><span>Tons hauled</span><div class="big">${tn.toFixed(0)}</div></div><div class="stat"><span>On the clock</span><div class="big">${on}</div></div></div>`; })() : ""}
    ${j.date === "Today" ? `<div class="row" style="gap:8px"><button class="btn small" type="button" data-tab="live" style="flex:1">See trucks on the map</button><button class="btn small ghost" type="button" data-act="share:${j.id}" style="flex:1">Share tracking link</button></div>` : ""}
    <div class="card"><div class="row"><h2>Trucks</h2><span class="muted num">${filled(j)} of ${needed(j)} booked</span></div>
      ${open.length ? `<p class="muted" style="font-size:13px">Still looking for ${open.join(", ")}. Sent to ${j.sentTo || 46} vetted drivers with the right trucks. The first ones to accept get the spots.</p>
        <button class="btn small ghost" type="button" data-act="as-driver" style="justify-self:start">See what drivers see</button>` : ""}
      <div class="list">${assignRows || '<div class="muted">No trucks yet.</div>'}</div></div>
    <div class="card"><div class="row"><h2>Load tickets</h2><span class="muted num">${tickets.length}</span></div>
      <div class="list">${tickets.length ? tickets.map(t => `<div class="row"><div class="row" style="justify-content:flex-start">${t.photo ? `<img class="thumb" src="${t.photo}" alt="Ticket ${esc(t.no)}">` : '<span class="thumb">photo</span>'}<div><strong class="num">#${esc(t.no)}</strong><div class="muted" style="font-size:13px">${esc(t.truck)} · ${esc(t.time)}</div></div></div><span class="num">${t.tons.toFixed(1)} t</span></div>`).join("") : '<div class="muted">Tickets show up here as drivers snap them.</div>'}</div></div>
    ${ready || j.approved ? `<div class="card"><h2>${j.approved ? "Invoice" : "Approve the day"}</h2>
      <div class="sum">${j.assignments.map(a => `<div class="row"><span>${esc(a.truck)} · ${a.hours} hrs × $${j.rate[a.type]}</span><span class="num">${money(billOf(j, a))}</span></div>`).join("")}
      <div class="row total"><span>Total, billed by bank transfer</span><span class="num">${money(bill)}</span></div></div>
      <p class="muted" style="font-size:13px">Includes the Trucks2U fee of ${money(bill * FEE)} (5%). Through a broker at 11% the cut would be about ${money(bill * BROKER)}.</p>
      ${j.approved ? '<span class="pill good" style="justify-self:start">Approved · owners paid within 2 business days</span>' : `<button class="btn good" type="button" data-act="approve:${j.id}">Approve hours and tickets</button>`}</div>`
    : `<div class="note">When every truck checks out, you approve hours and tickets here, and the invoice goes out automatically.</div>`}`;
}

function newJobForm() {
  const d = ui.draft;
  const stepBar = `<div class="steps">${[1, 2, 3].map(n => `<i class="${n <= d.step ? "on" : ""}"></i>`).join("")}</div>`;
  let body = "";
  if (d.step === 1) {
    body = `<label class="field">Job name<input id="f-name" value="${esc(d.name)}" placeholder="e.g. Elm St mill and pave"></label>
      <label class="field">What are the trucks doing?<select id="f-kind">${KINDS.map(k => `<option ${k === d.kind ? "selected" : ""}>${k}</option>`).join("")}</select></label>
      <label class="field">Job site address<input id="f-site" value="${esc(d.site)}" placeholder="Street and cross streets"></label>
      <label class="field">Asphalt plant (closest first)<select id="f-plant">${plantsByDistance().map(({ p, mi }) => `<option value="${p.id}" ${p.id === d.plant ? "selected" : ""}>${esc(p.name)} · ${mi.toFixed(1)} mi · ${driveMin(mi)} min${p.recycle ? " · recycling yard" : ""}</option>`).join("")}</select></label>
      <p class="muted" style="font-size:12.5px">Drive times are rough estimates from ${esc(ui.from || "Oakland")}. In the full app they come from the job's map pin.</p>
      <label class="field">Notes for drivers<input id="f-notes" value="${esc(d.notes)}" placeholder="Staging spot, gear, gate codes"></label>`;
  } else if (d.step === 2) {
    const pl = d.plan;
    const cycle = 2 * pl.drive + pl.loadDump;
    const perTruck = Math.max(1, Math.floor(pl.hours * 60 / cycle));
    const need = t => Math.ceil(pl.tons / (PAYLOAD[t] * perTruck));
    body = `<div class="card"><span class="eyebrow">Load planner</span><h2>How many trucks do I need?</h2>
      <div class="grid2"><label class="field">Tons to move<input id="p-tons" type="number" inputmode="numeric" value="${pl.tons}"></label>
        <label class="field">Hours of work<input id="p-hours" type="number" inputmode="decimal" value="${pl.hours}"></label>
        <label class="field">One-way drive (min)<input id="p-drive" type="number" inputmode="numeric" value="${pl.drive}"></label>
        <label class="field">Load + dump time (min)<input id="p-ld" type="number" inputmode="numeric" value="${pl.loadDump}"></label></div>
      <p class="muted num" style="font-size:13.5px">A round trip takes about ${cycle} min, so each truck can do <strong>${perTruck} loads</strong> in ${pl.hours} hours.</p>
      <div class="stack" style="gap:6px">${Object.keys(TYPES).map(t => `<div class="row"><span class="num">${need(t)} × ${TYPES[t].name} <span class="muted">(${PAYLOAD[t]} t a load)</span></span><button class="btn small ghost" type="button" data-act="plan:${t}:${need(t)}">Use</button></div>`).join("")}</div>
      <button class="btn small ghost" type="button" data-act="replan" style="justify-self:start">Recalculate</button></div>` + Object.keys(TYPES).map(t => `<div class="card"><div class="typecount">
        <div><strong>${TYPES[t].name}</strong><div class="muted" style="font-size:13px">${TYPES[t].spec}</div></div>
        <div class="stepper"><button type="button" data-act="dec:${t}" aria-label="Fewer ${TYPES[t].name}s">−</button><output class="num">${d.needs[t]}</output><button type="button" data-act="inc:${t}" aria-label="More ${TYPES[t].name}s">+</button></div></div>
        <label class="field">Hourly rate ($/hr)<input id="f-rate-${t}" type="number" inputmode="numeric" min="0" value="${d.rate[t]}"></label></div>`).join("");
  } else {
    const n = Object.values(d.needs).reduce((a, b) => a + b, 0);
    const est = Object.keys(TYPES).reduce((s, t) => s + d.needs[t] * d.rate[t] * 10, 0);
    body = `<div class="grid2"><label class="field">Date<select id="f-date">${["Today", "Tomorrow", "Mon, Oct 26", "Tue, Oct 27"].map(x => `<option ${x === d.date ? "selected" : ""}>${x}</option>`).join("")}</select></label>
      <label class="field">Start time<input id="f-start" value="${esc(d.start)}"></label></div>
      <div class="card"><span class="eyebrow">Review</span><h2>${esc(d.name || "Untitled job")}</h2><p class="muted" style="font-size:14px">${esc(d.kind)}</p>
        <div class="chips">${Object.keys(TYPES).filter(t => d.needs[t]).map(t => `<span class="chip">${d.needs[t]} × ${TYPES[t].name} @ $${d.rate[t]}/hr</span>`).join("")}</div>
        <div class="sum"><div class="row"><span>Estimate for a 10-hour day, ${n} trucks</span><span class="num">${money0(est)}</span></div>
        <div class="row"><span>Trucks2U fee inside that (5%)</span><span class="num">${money0(est * FEE)}</span></div>
        <div class="row"><span>What a broker would take (11%)</span><span class="num">${money0(est * BROKER)}</span></div></div></div>`;
  }
  const n = Object.values(d.needs).reduce((a, b) => a + b, 0);
  const canNext = d.step === 1 ? d.name.trim().length > 0 : d.step === 2 ? n > 0 : true;
  return `<button class="back" type="button" data-act="${d.step === 1 ? "cancel-job" : "prev"}">‹ ${d.step === 1 ? "Cancel" : "Back"}</button>
    <div class="stack" style="gap:6px"><span class="eyebrow">Post a job · step ${d.step} of 3</span>${stepBar}<h1>${["Job details", "Trucks needed", "Schedule and review"][d.step - 1]}</h1></div>
    ${body}
    <button class="btn" type="button" data-act="${d.step < 3 ? "next" : "post"}" ${canNext ? "" : "disabled"}>${d.step < 3 ? "Next" : "Post job to vetted owners"}</button>`;
}

function contractorBilling() {
  const approved = S.jobs.filter(j => j.approved);
  const pending = S.jobs.filter(j => !j.approved && allDone(j));
  const total = approved.reduce((s, j) => s + jobBill(j), 0);
  return `<h1>Billing</h1>
    <div class="card"><span class="eyebrow">Approved this month</span><div class="big">${money(total)}</div>

/* ---------- Live tracking (simulated) ---------- */
const CYCLE = 48;   // demo seconds per round trip, standing in for a ~48 minute cycle
const MAP_PATH = "M48 178 C 120 178, 120 70, 190 92 S 260 40, 296 46";
const short = s => s.replace(/^Job site: /, "").split(",")[0];
function liveTrucks() {
  return S.jobs.filter(j => j.date === "Today").flatMap(j => j.assignments.filter(a => a.status === "onsite").map((a, i) => ({ j, a, i })));
}
function truckState(i) {
  const p = ((Date.now() / 1000) / CYCLE + i * 0.29) % 1;
  if (p < 0.12) return { p, f: 0, stage: 0, eta: Math.round((0.12 - p) * CYCLE + 0.33 * CYCLE) };
  if (p < 0.45) return { p, f: (p - 0.12) / 0.33, stage: 1, eta: Math.round((0.45 - p) * CYCLE) };
  if (p < 0.55) return { p, f: 1, stage: 2, eta: 0 };
  return { p, f: 1 - (p - 0.55) / 0.45, stage: 3, eta: Math.round((1 - p) * CYCLE) };
}
function stageText(j, st) {
  const a = short(j.pickup), b = short(j.dropoff);
  return [`Loading at ${a}`, st.eta < 1 ? `Arriving at ${b}` : `Hauling to ${b} · ETA ${st.eta} min`, `Dumping at ${b}`, st.eta < 1 ? `Arriving at ${a}` : `Returning to ${a} · ${st.eta} min out`][st.stage];
}
function contractorLive() {
  const lt = liveTrucks();
  const j = S.jobs.find(x => x.date === "Today");
  const waiting = S.jobs.filter(x => x.date === "Today").flatMap(x => x.assignments.filter(a => a.status === "assigned"));
  return `<div class="stack" style="gap:4px"><span class="eyebrow">Today · live</span><h1>Where are my trucks?</h1></div>
    <div class="card" style="padding:10px">
      <svg class="map" id="map" viewBox="0 0 340 220" role="img" aria-label="Map of trucks between ${esc(short(j.pickup))} and ${esc(short(j.dropoff))}">
        <circle class="fence" cx="48" cy="178" r="26"/><circle class="fence" cx="296" cy="46" r="26"/>
        <path class="road" id="road" d="${MAP_PATH}"/><path class="road2" d="${MAP_PATH}"/>
        <text class="place" x="20" y="214">${esc(short(j.pickup))}</text><text class="place" x="320" y="14" text-anchor="end">${esc(short(j.dropoff))}</text>
        ${lt.map(({ a }) => `<g data-tk="${esc(a.truck)}"><circle class="tk" r="8"/><text class="tl" text-anchor="middle" dy="-12">${esc(a.truck)}</text></g>`).join("")}
      </svg>
      <div class="row" style="font-size:12px"><span class="muted">Green circles are geofences: arrival and departure are logged automatically.</span></div>
    </div>
    <div class="card"><div class="row"><h2>${esc(j.name)}</h2><span class="muted num">avg cycle ${CYCLE} min</span></div>
      <div class="list">${lt.map(({ j, a }) => `<div class="row"><div class="row" style="justify-content:flex-start"><span class="truck-ic">${TYPES[a.type].short}</span><div><strong>${esc(a.truck)} · ${esc(a.owner)}</strong><div class="stage" data-stage="${esc(a.truck)}">…</div></div></div><span class="muted num" style="font-size:13px">${a.tickets.length} load${a.tickets.length === 1 ? "" : "s"}</span></div>`).join("")}
      ${waiting.map(a => `<div class="row"><div class="row" style="justify-content:flex-start"><span class="truck-ic">${TYPES[a.type].short}</span><div><strong>${esc(a.truck)} · ${esc(a.owner)}</strong><div class="stage">Not checked in yet</div></div></div><span class="pill warn">Late?</span></div>`).join("")}</div></div>
    <div class="note">Simulated for the prototype. In the real app each truck's position comes from the driver's phone every 30 seconds.</div>`;
}
function tickMap() {
  const road = document.getElementById("road"); if (!road) return;
  const len = road.getTotalLength();
  liveTrucks().forEach(({ j, a, i }) => {
    const st = truckState(i), pt = road.getPointAtLength(st.f * len);
    const g = document.querySelector(`[data-tk="${a.truck}"]`);
    if (g) { g.setAttribute("transform", `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`); g.firstElementChild.classList.toggle("in", st.stage === 0 || st.stage === 2); }
    const s = document.querySelector(`[data-stage="${a.truck}"]`); if (s) s.textContent = stageText(j, st);
  });
}
setInterval(tickMap, 250);

const BFEE = 15;   // sample per-truck dispatch fee, per truck per day
const B = () => S.broker;
const bTruck = id => B().roster.find(t => t.id === id);
const bNeed = j => Object.values(j.needs).reduce((a, b) => a + b, 0);
const bFilled = j => Object.values(j.assigned).reduce((a, b) => a + b.length, 0);
const bDispatched = () => B().jobs.reduce((s, j) => s + bFilled(j), 0);
function bBusy(date) {
  const ids = new Set(B().jobs.filter(j => j.date === date).flatMap(j => Object.values(j.assigned).flat()));
  S.jobs.filter(j => j.date === date).forEach(j => j.assignments.forEach(a => ids.add(a.truck)));
  return ids;
}

function slotPicker(date, type, act) {
  const busy = bBusy(date);
  const free = B().roster.filter(t => t.type === type && !busy.has(t.id) && t.docs !== "bad");
  if (!free.length) return '<span class="muted" style="font-size:13px">No free verified trucks of this type</span>';
  const sid = "pick-" + act.replace(/:/g, "-");
  return `<div class="row" style="gap:8px"><select id="${sid}" aria-label="Choose a truck" style="flex:1;min-width:0">${free.map(t => `<option value="${t.id}">${t.id} · ${esc(t.driver)}${t.docs === "expiring" ? " (docs expiring)" : ""}</option>`).join("")}</select>
    <button class="btn small" type="button" data-act="${act}" data-pick="${sid}" style="flex:none">Dispatch</button></div>`;
}

function brokerJob(j) {
  const sections = Object.keys(TYPES).filter(t => j.needs[t]).map(t => {
    const rows = j.assigned[t].map(id => { const tr = bTruck(id); return `<div class="row"><div class="row" style="justify-content:flex-start"><span class="truck-ic">${TYPES[t].short}</span><div><strong>${id} · ${esc(tr.driver)}</strong><div class="muted" style="font-size:13px">${esc(tr.owner)}</div></div></div>
      <button class="btn small ghost" type="button" data-act="bun:${j.id}:${t}:${id}">Remove</button></div>`; }).join("");
    const left = j.needs[t] - j.assigned[t].length;
    return `<div class="card"><div class="row"><h2>${TYPES[t].name}</h2><span class="muted num">${j.assigned[t].length} of ${j.needs[t]}</span></div>
      <div class="list">${rows}${left > 0 ? `<div>${slotPicker(j.date, t, `bdis:${j.id}:${t}`)}</div>` : ""}</div></div>`;

    <div class="stack" style="gap:4px"><span class="eyebrow">${esc(j.id)} · ${esc(j.date)} · start ${esc(j.start)}</span><h1>${esc(j.name)}</h1><p class="muted">${esc(j.customer)} · ${esc(j.kind)}</p></div>

}

function brokerT2Job(j) {

    <div class="stack" style="gap:4px"><span class="eyebrow">Trucks2U contractor job · ${esc(j.date)} · ${esc(j.start)}</span><h1>${esc(j.name)}</h1><p class="muted">${esc(j.kind)}</p></div>
    <div class="card">${route(j)}</div>${sections || '<div class="note">This job is fully booked.</div>'}

function brokerTrucks() {

function submitSignup() {
  const su = ui.signup, f = su.f, F = su.files, id = "A" + (S.applicants.length + 1);
  const fileNote = k => F[k] ? "Uploaded: " + F[k].name : "Not uploaded";
  const fmtD = d => { const x = new Date(d + "T12:00:00"); return isNaN(x) ? d : x.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
  f.coiExp = fmtD(f.coiExp); f.cdlExp = fmtD(f.cdlExp);
  S.applicants.unshift({ id, name: f.biz, trucks: "one " + TYPES[f.ttype].name.toLowerCase(), fresh: true, checks: [
    [`USDOT ${f.usdot} active, no out-of-service order`, su.dot ? "good" : "warn", su.dot ? "Checked automatically" : "Not checked yet", null],
    [`Commercial auto liability, ${f.liab}`, "warn", `Expires ${f.coiExp} · needs review`, F.coi],
    ["Workers' comp", "warn", f.wcExempt ? "Sole-owner exemption, needs review" : fileNote("wc"), F.wc],
    [`CDL ${f.cdlClass}, expires ${f.cdlExp}`, "warn", "License photo uploaded · MVR check running", F.cdlFront],
    ["DOT medical card", "warn", fileNote("med"), F.med],
    ["Drug testing program and Clearinghouse", "warn", "Consortium letter uploaded · Clearinghouse consent given", F.drug],
    [`Truck registration and annual inspection (plate ${f.plate})`, "warn", "Registration and inspection uploaded", F.reg],
    ["W-9 and payout bank account", f.bank && F.w9 ? "good" : "warn", f.bank ? "Bank connected" + (F.w9 ? ", W-9 on file" : ", W-9 still needed") : "Bank not connected yet", F.w9]
  ] });
  su.done = true;
}

  return `<h1>Vetting queue</h1><p class="muted">No owner sees jobs until every check is green.</p>

      <div class="row"><h2>${esc(a.name)}</h2>${c.bad ? `<span class="pill bad">${c.bad} failed</span>` : c.warn ? `<span class="pill warn">${c.warn} to review</span>` : '<span class="pill good">Ready</span>'}</div>
      <span class="muted" style="font-size:13px">${esc(a.trucks)} · ${a.checks.filter(x => x[1] === "good").length} of ${a.checks.length} checks passed</span></button>`; }).join("") : '<div class="note">Queue is clear.</div>'}

  if (ui.signup) return signupScreen();
  if (ui.role === "contractor") {
    if (ui.draft) return newJobForm();
    if (v && v.startsWith("job:")) return contractorJob(job(v.slice(4)));
    if (v && v.startsWith("plant:")) return plantDetail(plant(v.slice(6)));
    return ui.tab === "bill" ? contractorBilling() : ui.tab === "live" ? contractorLive() : ui.tab === "plants" ? plantsScreen() : contractorJobs();
  }
  if (ui.role === "owner") {
    if (v && v.startsWith("work:")) { const [, jid, t] = v.split(":"); const j = job(jid); return ownerWork(j, j.assignments.find(a => a.truck === t)); }
    return { today: ownerToday, find: ownerFind, fleet: ownerFleet, pay: ownerPay, docs: ownerDocs }[ui.tab]();
  }
  if (ui.role === "broker") {
    if (v && v.startsWith("bjob:")) return brokerJob(B().jobs.find(j => j.id === v.slice(5)));
    if (v && v.startsWith("tjob:")) return brokerT2Job(job(v.slice(5)));
    return { board: brokerBoard, trucks: brokerTrucks, bfee: brokerBilling }[ui.tab]();
  }
  if (v && v.startsWith("app:")) return adminApplicant(S.applicants.find(a => a.id === v.slice(4)));
  return ui.tab === "over" ? adminOverview() : adminVetting();
}

function render() {
  document.querySelectorAll("[data-role]").forEach(b => b.setAttribute("aria-pressed", b.dataset.role === ui.role));
  $("#screen").innerHTML = screen();
  $("#tabs").innerHTML = TABS[ui.role].map(([k, label]) => `<button type="button" data-tab="${k}" ${ui.tab === k && !ui.view && !ui.draft ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${label}</button>`).join("");
  tickMap();
}

function syncDraft() {
  const d = ui.draft; if (!d) return;
  const val = id => { const el = document.getElementById(id); return el ? el.value : null; };
  if (d.step === 1) {
    d.name = val("f-name") ?? d.name; d.kind = val("f-kind") ?? d.kind; d.site = val("f-site") ?? d.site; d.notes = val("f-notes") ?? d.notes;
    const np = val("f-plant"); if (np && np !== d.plant) { d.plant = np; d.plan.drive = driveMin(miles(SITE, plant(np))); }
  }
  if (d.step === 2) {
    Object.keys(TYPES).forEach(t => { const r = parseFloat(val("f-rate-" + t)); if (!isNaN(r)) d.rate[t] = r; });
    [["p-tons", "tons"], ["p-hours", "hours"], ["p-drive", "drive"], ["p-ld", "loadDump"]].forEach(([id, k]) => { const x = parseFloat(val(id)); if (x > 0) d.plan[k] = x; });
  }
  if (d.step === 3) { d.date = val("f-date") ?? d.date; d.start = val("f-start") ?? d.start; }
}

// Prototype only: other drivers on the app accept a new job one by one, leaving a spot for you to try.
const OTHER_DRIVERS = [["R&J Trucking", "R-8"], ["Bautista Transport", "B-2"], ["Ortega Trucking", "O-4"], ["Moreno Bros", "M-6"], ["Kowalski & Sons", "K-3"], ["Hill Country Haul", "H-1"], ["Patel Freight", "PF-2"], ["Reyes Hauling", "RH-5"]];
function simulateAccepts(id) {
  const step = () => {
    const j = job(id); if (!j) return;
    const open = Object.keys(TYPES).filter(t => j.needs[t] > filled(j, t));
    if (needed(j) - filled(j) <= 1 || !open.length) return;
    const t = open[Math.floor(Math.random() * open.length)];
    const [owner, tk] = OTHER_DRIVERS[j.assignments.length % OTHER_DRIVERS.length];
    j.assignments.push({ truck: tk + "-" + j.assignments.length, type: t, owner, status: "assigned", checkIn: null, hours: null, tickets: [] });
    if (ui.role === "contractor") toast(`${owner} accepted (${TYPES[t].name}). ${filled(j)} of ${needed(j)} filled.`);
    const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
    if (!ui.draft && !ui.dspEdit && !typing && !ui.view?.startsWith("work:") && ui.tab !== "plants") render();
    setTimeout(step, 3500);
  };
  setTimeout(step, 3000);
}

function nowTime() { return new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }

function act(name, arg1, arg2, arg3, pick) {
  const d = ui.draft;
  switch (name) {
    case "new-job":
      ui.draft = { step: 1, name: "", kind: KINDS[2], site: "", plant: plantsByDistance()[0].p.id, notes: "", needs: { w10: 0, w12: 2, sd: 0 }, rate: { w10: 115, w12: 130, sd: 150 }, date: "Tomorrow", start: "6:00 AM", plan: { tons: 600, hours: 10, drive: driveMin(plantsByDistance()[0].mi), loadDump: 20 } }; break;
    case "replan": syncDraft(); break;
    case "plan": syncDraft(); Object.keys(TYPES).forEach(t => d.needs[t] = 0); d.needs[arg1] = +arg2; toast(`Set to ${arg2} × ${TYPES[arg1].name}.`); break;
    case "cancel-job": ui.draft = null; break;
    case "next": syncDraft(); d.step++; break;
    case "prev": syncDraft(); d.step--; break;
    case "inc": syncDraft(); d.needs[arg1] = Math.min(20, d.needs[arg1] + 1); break;
    case "dec": syncDraft(); d.needs[arg1] = Math.max(0, d.needs[arg1] - 1); break;
    case "post": {
      syncDraft();
      const id = "J-" + (1048 + S.jobs.length);
      const pl = plant(d.plant), siteTxt = "Job site: " + (d.site.trim() || d.name.trim()), plTxt = `${pl.name}, ${pl.addr}`;
      S.jobs.unshift({ id, name: d.name.trim(), kind: d.kind, pickup: d.kind === KINDS[1] ? plTxt : siteTxt, dropoff: d.kind === KINDS[1] ? siteTxt : plTxt, date: d.date, start: d.start, needs: { ...d.needs }, rate: { ...d.rate }, notes: d.notes, approved: false, assignments: [] });
      S.jobs[0].sentTo = 38 + Math.floor(Math.random() * 20);
      ui.draft = null; ui.view = "job:" + id; toast(`Sent to ${S.jobs[0].sentTo} vetted drivers. Watch the spots fill.`); simulateAccepts(id); break;
    }
    case "approve": job(arg1).approved = true; toast("Approved. Invoice sent and owners paid out."); break;
    case "dsp-edit": ui.dspEdit = arg1; break;
    case "dsp-cancel": ui.dspEdit = null; break;
    case "dsp-save": { const j = anyJob(arg1), d = dsp(j); DSP_FIELDS.forEach(([k]) => { d[k] = $("#d-" + k).value.trim(); }); j.notes = d.notes; ui.dspEdit = null;
      updatesOf(j).push({ time: nowTime(), text: "Dispatch info was updated. Check the details below.", readBy: [] }); toast("Saved. Drivers got a text and an alert in the app."); break; }
    case "dsp-send": { const j = anyJob(arg1), t = $("#d-msg").value.trim(); if (!t) { toast("Type the update first."); return; }
      updatesOf(j).push({ time: nowTime(), text: t, readBy: [] }); toast("Sent. Drivers got a text and an alert in the app."); break; }
    case "dsp-ack": { const j = anyJob(arg1); updatesOf(j).forEach(u => { if (!u.readBy.includes(arg2)) u.readBy.push(arg2); }); toast("Dispatch knows you've read it."); break; }
    case "pass": S.passed.push(arg1); toast("Passed. You won't see this request again."); break;
    case "as-driver": ui = { role: "owner", tab: "today", view: null, draft: null }; render(); window.scrollTo(0, 0); return;
    case "accept": {
      const j = job(arg1), t = MY_TRUCKS.find(x => x.id === arg2);
      if (filled(j, t.type) >= j.needs[t.type]) { toast("Sorry, another driver just took that spot."); break; }
      j.assignments.push({ truck: t.id, type: t.type, owner: ME_OWNER, status: "assigned", checkIn: null, hours: null, tickets: [] });
      toast(`${t.id} booked on ${j.name}.`); break;
    }
    case "checkin": { const a = job(arg1).assignments.find(x => x.truck === arg2); a.status = "onsite"; a.checkIn = nowTime(); toast("Checked in."); break; }
    case "ticket": {
      const a = job(arg1).assignments.find(x => x.truck === arg2);
      const no = $("#t-no").value.trim(), tn = parseFloat($("#t-tons").value), file = $("#t-photo").files[0];
      if (!no || isNaN(tn)) { toast("Enter the ticket number and tons."); return; }
      const add = photo => { a.tickets.push({ no, tons: tn, time: nowTime(), photo }); toast("Ticket saved. The contractor can see it now."); render(); };
      if (file) { const r = new FileReader(); r.onload = () => add(r.result); r.readAsDataURL(file); } else add(null);
      return;
    }
    case "checkout": {
      const a = job(arg1).assignments.find(x => x.truck === arg2), h = parseFloat($("#t-hours").value);
      if (isNaN(h) || h <= 0) { toast("Enter the hours worked."); return; }
      a.status = "done"; a.hours = h; toast("Checked out. Sent to the contractor for approval."); break;
    }
    case "coi": if (!$("#coi").files.length) { toast("Choose the certificate file first."); return; } S.insuranceRenewed = true; toast("Uploaded. Trucks2U reviews it within 1 business day."); break;
    case "verify": { const a = S.applicants.find(x => x.id === arg1); a.checks[+arg2][1] = "good"; a.checks[+arg2][2] = "Reviewed and approved by admin"; break; }
    case "bdis": { const j = B().jobs.find(x => x.id === arg1); j.assigned[arg2].push(pick); toast(`${pick} dispatched. ${bTruck(pick).driver} got the job details by text.`); break; }
    case "bun": { const j = B().jobs.find(x => x.id === arg1); j.assigned[arg2] = j.assigned[arg2].filter(x => x !== arg3); toast(`${arg3} removed. The driver was notified.`); break; }
    case "tdis": { const j = job(arg1), t = bTruck(pick); j.assignments.push({ truck: t.id, type: t.type, owner: t.owner + " (via " + B().name + ")", status: "assigned", checkIn: null, hours: null, tickets: [] }); toast(`${t.id} booked on ${j.name}. The contractor sees it now.`); break; }
    case "invite": toast("In the full app this sends the owner a sign-up link by text."); return;
    case "share": {
      const link = "trucks2u.com/track/" + arg1.toLowerCase();
      try { navigator.clipboard.writeText("https://" + link).then(() => toast("Tracking link copied. Your customer sees trucks and ETAs, no login."), () => toast("Tracking link: " + link)); } catch (e) { toast("Tracking link: " + link); }
      return;
    }
    case "driver": S.driverOf[arg1] = pick; toast(`${pick} is driving ${arg1}. They get the job texts.`); break;
    case "suggest": toast("In the full app this sends your correction to Trucks2U to check."); return;
    case "reject": { const a = S.applicants.find(x => x.id === arg1); a.checks[+arg2][1] = "bad"; a.checks[+arg2][2] = "Rejected. The owner got a text asking for a new document."; toast("Rejected. The owner was asked to upload a new one."); break; }
    case "su-start": ui.signup = newSignup(); break;
    case "su-close": ui.signup = null; break;
    case "su-next": ui.signup.step++; break;
    case "su-prev": ui.signup.step--; break;
    case "su-dot": { const n = (ui.signup.f.usdot || "").replace(/\D/g, ""); if (n.length < 6) { toast("Enter your USDOT number first."); return; } ui.signup.dot = `✓ USDOT ${n} is active, authorized for property, no out-of-service order. (Sample result; the real app asks FMCSA.)`; break; }
    case "su-bank": ui.signup.f.bank = true; toast("Bank connected (sample)."); break;
    case "su-submit": submitSignup(); toast("Sent for review."); break;
    case "su-admin": { const id = S.applicants[0].id; ui = { role: "admin", tab: "vet", view: "app:" + id, draft: null }; break; }
    case "approve-app": S.approvedApplicants.push(arg1); ui.view = null; toast("Approved. The owner can now accept jobs."); break;
  }
  render();
}

document.addEventListener("click", e => {
  const r = e.target.closest("[data-role]");
  if (r) { ui = { role: r.dataset.role, tab: TABS[r.dataset.role][0][0], view: null, draft: null }; render(); window.scrollTo(0, 0); return; }
  const t = e.target.closest("[data-tab]");
  if (t) { ui.tab = t.dataset.tab; ui.view = null; ui.draft = null; render(); window.scrollTo(0, 0); return; }
  const g = e.target.closest("[data-go]");
  if (g) { ui.view = g.dataset.go === "back" ? null : g.dataset.go; ui.dspEdit = null; render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest("[data-act]");
  if (a) { const [n, x, y, z] = a.dataset.act.split(":"); const pk = a.dataset.pick ? document.getElementById(a.dataset.pick).value : null; act(n, x, y, z, pk); }
});
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.f;
  if (k && ui.signup) ui.signup.f[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
});
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.f;
  if (k && ui.signup) { ui.signup.f[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value; if (e.target.type === "checkbox" && ui.signup.step === 5) render(); }
  const fk = e.target.dataset && e.target.dataset.file;
  if (fk && ui.signup && e.target.files[0]) {
    const file = e.target.files[0], su = ui.signup;
    if (file.type.startsWith("image/")) { const r = new FileReader(); r.onload = () => { su.files[fk] = { name: file.name, url: r.result }; render(); }; r.readAsDataURL(file); }
    else { su.files[fk] = { name: file.name, url: null }; render(); }
  }
  if (ui.draft && ui.draft.step === 1 && (e.target.id === "f-plant" || e.target.id === "f-kind")) { syncDraft(); render(); }
  if (e.target.id === "pl-q") { ui.plq = e.target.value; render(); }
  if (e.target.id === "pl-from") { ui.from = e.target.value; SITE = FROM[ui.from]; render(); }
});
document.addEventListener("input", e => {
  if (ui.draft && ui.draft.step === 1 && e.target.id === "f-name") {
    ui.draft.name = e.target.value;
    const b = $("[data-act=next]"); if (b) b.disabled = !e.target.value.trim();
  }
});
$("#reset").addEventListener("click", () => { S = seed(); ui = { role: ui.role, tab: TABS[ui.role][0][0], view: null, draft: null }; render(); toast("Demo reset."); });
// Direct links: #signup opens the truck owner sign-up, as a new driver would see it.
function openFromHash() {
  if (location.hash === "#signup") { ui = { role: "owner", tab: "docs", view: null, draft: null, signup: newSignup() }; }
  render();
}
window.addEventListener("hashchange", openFromHash);
openFromHash();
</script>
