<style>
/* Layout: one phone-width app column; brand bar on top, role switcher, screen, bottom tab bar. */
:root {

  --good-soft: #e1f4e8;
  --warn: #a86400;
  --warn-soft: #fdf0d9;
  --bad: #c0352b;
  --bad-soft: #fbe5e3;

    --fg: #e8eef8; --muted: #93a2bd; --brand: #050b17; --brand-fg: #ffffff;
    --accent: #3d86ff; --accent-fg: #ffffff; --accent-soft: #15284d;
    --good: #4cc47e; --good-soft: #10301f; --warn: #f0a73a; --warn-soft: #34260c;
    --bad: #f0726a; --bad-soft: #3a1513; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070e1c; --surface: #101b31; --surface-2: #0c1527; --line: #22314f;
  --fg: #e8eef8; --muted: #93a2bd; --brand: #050b17; --brand-fg: #ffffff;
  --accent: #3d86ff; --accent-fg: #ffffff; --accent-soft: #15284d;
  --good: #4cc47e; --good-soft: #10301f; --warn: #f0a73a; --warn-soft: #34260c;
  --bad: #f0726a; --bad-soft: #3a1513; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
.wrap { max-width: 460px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; display: grid; gap: 12px; }

.logo { font: italic 800 26px/1 var(--display); letter-spacing: .5px; }
.logo b { color: #4d94ff; }
.bar small { font: 600 11px/1.2 var(--body); letter-spacing: 1.5px; text-transform: uppercase; opacity: .7; text-align: right; }
.roles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.roles button { border: 0; background: transparent; color: var(--muted); font: 600 13px/1.2 var(--body); padding: 9px 2px; border-radius: 9px; cursor: pointer; }
.roles button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.roles-label { font: 600 11px/1 var(--body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.roles-label button { background: none; border: 0; color: var(--accent); font: inherit; letter-spacing: inherit; cursor: pointer; padding: 0; }
main { flex: 1; padding: 16px; display: grid; gap: 14px; align-content: start; }

h2 { font: 700 19px/1.15 var(--display); margin: 0; letter-spacing: .2px; }
.eyebrow { font: 600 11px/1 var(--body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card.tap { cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.card.tap:hover { border-color: var(--accent); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.row > * { min-width: 0; }
.stack { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 12px/1 var(--body); padding: 5px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill { font: 700 11px/1 var(--body); letter-spacing: .6px; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.btn { border: 0; border-radius: 11px; background: var(--accent); color: var(--accent-fg); font: 700 15px/1 var(--body); padding: 13px 16px; cursor: pointer; width: 100%; }
.btn.ghost { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
.btn.small { width: auto; padding: 9px 12px; font-size: 13px; border-radius: 9px; }
.btn.good { background: var(--good); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .roles button:focus-visible, .tabs button:focus-visible, .card.tap:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.back { background: none; border: 0; color: var(--accent); font: 600 14px/1 var(--body); padding: 0; cursor: pointer; justify-self: start; }
.num { font-variant-numeric: tabular-nums; }
.big { font: 700 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 4px; }
.stat .big { font-size: 22px; }
.stat span { font-size: 12px; color: var(--muted); }
.meter { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.route { display: grid; grid-template-columns: 14px 1fr; gap: 2px 10px; font-size: 14px; }
.route .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); margin-top: 5px; }
.route .dot.end { background: var(--accent); }
.route .line { width: 2px; background: var(--line); margin-left: 4px; height: 14px; }
.list { display: grid; gap: 0; }
.list > div { padding: 10px 0; border-top: 1px solid var(--line); }
.list > div:first-child { border-top: 0; padding-top: 0; }
.truck-ic { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; font: 700 13px/1 var(--display); }
.thumb { width: 44px; height: 44px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); object-fit: cover; flex: none; display: grid; place-items: center; font-size: 10px; color: var(--muted); }
label.field { display: grid; gap: 6px; font: 600 13px/1.2 var(--body); color: var(--muted); }
input, select, textarea { width: 100%; font: 500 15px/1.3 var(--body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps i { height: 4px; border-radius: 4px; background: var(--line); }
.steps i.on { background: var(--accent); }
.typecount { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 700 18px/1 var(--body); cursor: pointer; }
.stepper output { width: 28px; text-align: center; font: 700 18px/1 var(--display); }
.trip { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.sum { display: grid; gap: 6px; font-size: 14px; }
.sum .row { padding: 2px 0; }
.sum .total { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 700; }
.check { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; }
.check .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--body); margin-top: 1px; }
.mark.good { background: var(--good-soft); color: var(--good); }
.mark.warn { background: var(--warn-soft); color: var(--warn); }
.mark.bad { background: var(--bad-soft); color: var(--bad); }
.note { font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: 4px; }
.tabs button { background: none; border: 0; color: var(--muted); font: 600 11.5px/1.1 var(--body); padding: 10px 2px 8px; display: grid; justify-items: center; gap: 4px; cursor: pointer; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs svg { width: 22px; height: 22px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--brand); color: var(--brand-fg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; }
.map { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.map .road { fill: none; stroke: var(--line); stroke-width: 9; stroke-linecap: round; }
.map .road2 { fill: none; stroke: var(--surface); stroke-width: 2; stroke-dasharray: 6 6; }
.map .fence { fill: var(--good-soft); stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 4 3; }
.map .place { fill: var(--fg); font: 700 11px var(--body); }
.map .tk { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.map .tk.in { fill: var(--good); }
.map .tk.off { fill: var(--muted); }
.gmap .land { fill: var(--surface-2); }
.gmap .grid { stroke: var(--line); stroke-width: .6; }
.gmap .city { fill: var(--muted); }
.gmap .cityl { fill: var(--muted); font: 600 9.5px var(--body); }
.gmap .plantdot { fill: var(--muted); opacity: .55; }
.gmap .leg { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 7 5; stroke-linecap: round; }
.gmap .pinA { fill: var(--good); stroke: var(--surface); stroke-width: 1.5; }
.gmap .pinB { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
.gmap .pinl { fill: var(--fg); font: 700 10.5px var(--body); paint-order: stroke; stroke: var(--surface-2); stroke-width: 3px; }
.gmap .scale { stroke: var(--fg); stroke-width: 1.5; }
.gmap .scalel { fill: var(--fg); font: 600 9px var(--body); }
.map .tl { fill: var(--fg); font: 700 10px var(--body); }
.stage { font-size: 12.5px; color: var(--muted); }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .card.tap { transition: border-color .15s; } }
/* Computer view: wider page, tabs move to a left sidebar, cards sit side by side. */
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; justify-self: center; }

.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-fg); }
.seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
:root[data-layout="wide"] .wrap { max-width: 1180px; }
:root[data-layout="wide"] .app { display: grid; grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: auto 1fr; grid-template-areas: "bar bar" "side main"; min-height: 720px; }

:root[data-layout="wide"] .tabs button[aria-current="page"] { background: var(--accent-soft); }

@media (max-width: 640px) {
  :root[data-layout="wide"] .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "main" "side"; }

function toast(msg) {

function statusPill(a) {
  if (a.status === "done") return '<span class="pill good">Checked out</span>';
  if (a.status === "onsite") return '<span class="pill info">On the clock</span>';
  return '<span class="pill warn">Assigned</span>';
}

// Every job has two places: the job site, and where the truck goes to pick up material or dump.
const kindIx = j => j.kindIx ?? (j.kindIx = KINDS.indexOf(j.kind));   // remembered, so renaming a job type in Settings keeps old jobs straight
const delivers = j => kindIx(j) === 1;   // "Deliver asphalt": the truck loads at the plant and brings it to the site
const siteText = j => (delivers(j) ? j.dropoff : j.pickup).replace(/^Job site: /, "");
const destText = j => delivers(j) ? j.pickup : j.dropoff;
const destLabel = j => ["Dump site", "Plant: pick up asphalt", "Plant: dump grindings, load asphalt"][kindIx(j)] || "Destination";
const siteP = j => delivers(j) ? j.pts.dropoff : j.pts.pickup;
const destP = j => delivers(j) ? j.pts.pickup : j.pts.dropoff;
function route(j) {
  return `<div class="route"><span class="dot site"></span><span><small>Job site</small>${esc(siteText(j))}</span><span class="line"></span><span></span><span class="dot end"></span><span><small>${destLabel(j)}</small>${esc(destText(j))}</span></div>`;
}

/* Project map: drawn from GPS coordinates (the prototype can't load map tiles; the real app uses a street map). */
const PIN = "M0 0C-5 -7 -8 -10.5 -8 -15A8 8 0 1 1 8 -15C8 -10.5 5 -7 0 0Z";
function jobMap(j, opts = {}) {
  if (!j.pts) return "";
  const A = siteP(j), Bp = destP(j), W = 340, H = opts.h || 200;
  const k = Math.cos((A.lat + Bp.lat) / 2 * Math.PI / 180);   // longitude shrinks with latitude
  const cx = (A.lng + Bp.lng) / 2 * k, cy = (A.lat + Bp.lat) / 2;
  let w = Math.max(Math.abs(A.lng - Bp.lng) * k, 0.02) * 1.7, h = Math.max(Math.abs(A.lat - Bp.lat), 0.02) * 1.7;
  if (w / h > W / H) h = w * H / W; else w = h * W / H;
  const P = q => [(q.lng * k - (cx - w / 2)) / w * W, (cy + h / 2 - q.lat) / h * H];
  const inside = q => { const [x, y] = P(q); return x > 10 && x < W - 10 && y > 10 && y < H - 10; };
  const [ax, ay] = P(A), [bx, by] = P(Bp), f1 = n => n.toFixed(1);
  const grid = [1, 2, 3, 4, 5, 6, 7].map(i => `<line class="grid" x1="${i * W / 8}" y1="0" x2="${i * W / 8}" y2="${H}"/>`).join("") + [1, 2, 3, 4].map(i => `<line class="grid" x1="0" y1="${i * H / 5}" x2="${W}" y2="${i * H / 5}"/>`).join("");
  const cities = Object.entries(FROM).filter(([, q]) => inside(q)).map(([n, q]) => { const [x, y] = P(q); return `<circle class="city" cx="${f1(x)}" cy="${f1(y)}" r="2.5"/><text class="cityl" x="${f1(x + 5)}" y="${f1(y + 3)}">${esc(n)}</text>`; }).join("");
  const plants = PLANTS.filter(inside).map(q => { const [x, y] = P(q); return `<rect class="plantdot" x="${f1(x - 2.5)}" y="${f1(y - 2.5)}" width="5" height="5"><title>${esc(q.name)}</title></rect>`; }).join("");
  const pxPerMi = H / h / 69, step = [0.5, 1, 2, 5, 10, 20].find(m => m * pxPerMi >= 40) || 20;
  const label = (x, y, t) => `<text class="pinl" x="${f1(x > W * 0.6 ? x - 11 : x + 11)}" y="${f1(Math.max(y - 9, 14))}" text-anchor="${x > W * 0.6 ? "end" : "start"}">${esc(t)}</text>`;
  return `<div class="mapbox" data-lmap="${esc(j.id)}" data-truck="${esc(opts.truck || "")}"><svg class="map gmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map: job site to ${esc(short(destText(j)))}, about ${miles(A, Bp).toFixed(0)} miles">
    <rect class="land" width="${W}" height="${H}"/>${grid}${plants}${cities}
    <line class="leg" x1="${f1(ax)}" y1="${f1(ay)}" x2="${f1(bx)}" y2="${f1(by)}"/>
    <path class="pinA" d="${PIN}" transform="translate(${f1(ax)} ${f1(ay)})"/><path class="pinB" d="${PIN}" transform="translate(${f1(bx)} ${f1(by)})"/>
    ${label(ax, ay, "Job site")}${label(bx, by, short(destText(j)))}
    ${opts.truck ? `<g data-ptk="${esc(opts.truck)}" data-job="${esc(j.id)}" data-a="${P(j.pts.pickup).map(f1)}" data-b="${P(j.pts.dropoff).map(f1)}" style="display:none"><circle class="tk" r="7"/><text class="tl" text-anchor="middle" dy="-11">${esc(opts.truck)}</text></g>` : ""}
    <line class="scale" x1="12" y1="${H - 12}" x2="${f1(12 + step * pxPerMi)}" y2="${H - 12}"/><text class="scalel" x="12" y="${H - 17}">${step} mi</text>
    <text class="scalel" x="${W - 14}" y="18" text-anchor="middle">N ↑</text>
  </svg><div class="lm"></div></div>`;
}
const LMAPS = [];
function initMaps() {
  LMAPS.splice(0).forEach(m => { try { m.map.remove(); } catch (e) {} });
  if (!window.L) return;   // map library didn't load: the drawn map stays
  const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  document.querySelectorAll("[data-lmap]").forEach(box => {
    const j = anyJob(box.dataset.lmap); if (!j || !j.pts) return;
    const A = siteP(j), Bp = destP(j), truck = box.dataset.truck;
    const still = !!box.closest("button");   // a map inside a tappable job card stays still, so a tap opens the job
    const map = L.map(box.querySelector(".lm"), { scrollWheelZoom: false, zoomSnap: 0.25, ...(still ? { dragging: false, zoomControl: false, touchZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false } : {}) });
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19,
      attribution: 'Tiles &copy; <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a> and contributors' })
      .once("tileload", () => box.classList.add("live")).addTo(map);
    map.fitBounds([[A.lat, A.lng], [Bp.lat, Bp.lng]], { padding: [40, 40] });
    L.polyline([[A.lat, A.lng], [Bp.lat, Bp.lng]], { color: col("--accent"), weight: 3, dashArray: "7 6" }).addTo(map);
    const pin = (q, fill, text) => L.circleMarker([q.lat, q.lng], { radius: 9, color: "#fff", weight: 2, fillColor: fill, fillOpacity: 1 })
      .bindTooltip(text, { permanent: true, direction: "top", offset: [0, -9] }).addTo(map);
    pin(A, col("--good"), "Job site"); pin(Bp, col("--accent"), short(destText(j)));
    const tm = truck ? L.circleMarker([A.lat, A.lng], { radius: 7, color: "#fff", weight: 2, fillColor: col("--accent"), fillOpacity: 1 }).bindTooltip(truck, { permanent: true, direction: "right", offset: [8, 0] }) : null;
    LMAPS.push({ map, j, truck, tm, off: col("--muted"), on: col("--accent") });
  });
  tickMap();
}
function directions(j) {
  if (!j.pts) return "";
  const A = siteP(j), Bp = destP(j), mi = miles(A, Bp), ll = q => q.lat + "," + q.lng;
  const go = q => `https://www.google.com/maps/dir/?api=1&destination=${ll(q)}&travelmode=driving`;
  return `<div class="row muted num" style="font-size:13px"><span><span style="color:var(--good)">●</span> Job site ↔ <span style="color:var(--accent)">●</span> ${esc(short(destText(j)))}</span><span style="flex:none">${mi.toFixed(1)} mi · ~${driveMin(mi)} min</span></div>
    <div class="row" style="gap:8px"><a class="btn small ghost" href="${go(A)}" target="_blank" rel="noopener" style="flex:1;text-align:center;text-decoration:none">Directions to job site</a><a class="btn small ghost" href="${go(Bp)}" target="_blank" rel="noopener" style="flex:1;text-align:center;text-decoration:none">Directions to ${esc(short(destText(j)))}</a></div>
    <a class="back" href="https://www.google.com/maps/dir/?api=1&origin=${ll(A)}&destination=${ll(Bp)}&travelmode=driving" target="_blank" rel="noopener" style="text-decoration:none">See the whole route on Google Maps ›</a>`;
}

/* ---------- Dispatch info (job notes for drivers) ---------- */
const DSP_FIELDS = [["contact", "On-site contact"], ["phone", "Contact phone"], ["staging", "Staging spot"], ["gate", "Gate and access"],

/* ---------- Contractor ---------- */
function contractorJobs() {
  const active = S.jobs.filter(j => !j.approved);
  const done = S.jobs.filter(j => j.approved);
  const card = j => {
    const pct = Math.round(100 * filled(j) / Math.max(1, needed(j)));
    let pill = filled(j) >= needed(j) ? '<span class="pill good">Fully booked</span>' : '<span class="pill warn">Finding trucks</span>';
    if (allDone(j) && !j.approved) pill = '<span class="pill info">Ready to approve</span>';
    if (j.approved) pill = '<span class="pill good">Approved</span>';
    return `<button type="button" class="card tap" data-go="job:${j.id}">
      <div class="row"><span class="eyebrow">${esc(j.date)} · ${esc(j.start)}</span>${pill}</div>
      <h2>${esc(j.name)}</h2>
      <p class="muted" style="font-size:14px">${esc(j.kind)}</p>
      <div class="meter" aria-label="${pct}% of trucks booked"><i style="width:${pct}%"></i></div>
      <div class="row"><div class="chips">${jobFillChips(j)}</div><span class="muted num" style="font-size:13px">${filled(j)} of ${needed(j)} trucks</span></div>
    </button>`;
  };
  return `<div class="row"><h1>Your jobs</h1><button class="btn small" type="button" data-act="new-job">+ Post a job</button></div>
    ${active.map(card).join("")}
    ${done.length ? `<p class="eyebrow">Approved and billed</p>${done.map(card).join("")}` : ""}`;
}

/* ---------- Live tracking (simulated) ---------- */
const CYCLE = 48;   // demo seconds per round trip, standing in for a ~48 minute cycle
const MAP_PATH = "M48 178 C 120 178, 120 70, 190 92 S 260 40, 296 46";
const short = s => s.replace(/^Job site: /, "").split(",")[0];
function liveTrucks() {
  return S.jobs.filter(j => j.date === "Today").flatMap(j => j.assignments.filter(a => a.status === "onsite").map((a, i) => ({ j, a, i })));
}
function truckState(i) {
  const p = ((Date.now() / 1000) / CYCLE + i * 0.29) % 1;
  if (p < 0.12) return { p, f: 0, stage: 0, eta: Math.round((0.12 - p) * CYCLE + 0.33 * CYCLE) };
  if (p < 0.45) return { p, f: (p - 0.12) / 0.33, stage: 1, eta: Math.round((0.45 - p) * CYCLE) };
  if (p < 0.55) return { p, f: 1, stage: 2, eta: 0 };
  return { p, f: 1 - (p - 0.55) / 0.45, stage: 3, eta: Math.round((1 - p) * CYCLE) };
}
function stageText(j, st) {
  const a = short(j.pickup), b = short(j.dropoff);
  return [`Loading at ${a}`, st.eta < 1 ? `Arriving at ${b}` : `Hauling to ${b} · ETA ${st.eta} min`, `Dumping at ${b}`, st.eta < 1 ? `Arriving at ${a}` : `Returning to ${a} · ${st.eta} min out`][st.stage];
}

/* ---------- GPS (simulated; the real app reads the driver's phone) ---------- */
const gpsStage = {};   // last stage seen per truck, to spot geofence crossings
function logGps(text) {
  S.gpsLog.unshift({ time: nowTime(), text }); S.gpsLog.length = Math.min(S.gpsLog.length, 30);
  const el = document.getElementById("gpslog"); if (el) el.innerHTML = gpsLogHtml();
}
function gpsLogHtml() {
  return S.gpsLog.slice(0, 8).map(e => `<div class="row" style="align-items:flex-start"><span style="font-size:14px">${esc(e.text)}</span><span class="muted num" style="font-size:12px;flex:none">${esc(e.time)}</span></div>`).join("") || '<div class="muted">No GPS events yet.</div>';
}
function gpsText(truck) {
  if (S.gpsPaused[truck]) return "Paused. Dispatch and the contractor can't see your truck.";
  const lt = liveTrucks().find(x => x.a.truck === truck);
  return lt ? stageText(lt.j, truckState(lt.i)) + " · updated just now" : "Sharing location · updated just now";
}
function tickMap() {
  const road = document.getElementById("road"), len = road ? road.getTotalLength() : 0;
  liveTrucks().forEach(({ j, a, i }) => {
    const st = truckState(i), off = !!S.gpsPaused[a.truck];
    if (!off) {
      const prev = gpsStage[a.truck]; gpsStage[a.truck] = st.stage;
      if (prev !== undefined && prev !== st.stage) logGps(`${a.truck} ${["arrived at " + short(j.pickup), "left " + short(j.pickup), "arrived at " + short(j.dropoff), "left " + short(j.dropoff)][st.stage]}.`);
    }
    const g = road && document.querySelector(`[data-tk="${a.truck}"]`);
    if (g) {
      if (!off) { const pt = road.getPointAtLength(st.f * len); g.setAttribute("transform", `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`); }
      g.firstElementChild.classList.toggle("in", !off && (st.stage === 0 || st.stage === 2)); g.firstElementChild.classList.toggle("off", off);
    }
    const s = document.querySelector(`[data-stage="${a.truck}"]`); if (s) s.textContent = off ? "GPS paused by driver" : stageText(j, st);
  });
  document.querySelectorAll("[data-ptk]").forEach(g => {
    const lt = liveTrucks().find(x => x.a.truck === g.dataset.ptk && x.j.id === g.dataset.job), off = !!S.gpsPaused[g.dataset.ptk];
    if (!lt) { g.style.display = "none"; return; }
    const st = truckState(lt.i), [ax, ay] = g.dataset.a.split(",").map(Number), [bx, by] = g.dataset.b.split(",").map(Number);
    if (!off || g.style.display === "none") g.setAttribute("transform", `translate(${(ax + (bx - ax) * st.f).toFixed(1)} ${(ay + (by - ay) * st.f).toFixed(1)})`);
    g.style.display = ""; g.firstElementChild.classList.toggle("off", off); g.firstElementChild.classList.toggle("in", !off && (st.stage === 0 || st.stage === 2));
  });
  LMAPS.forEach(m => {
    if (!m.tm) return;
    const lt = liveTrucks().find(x => x.a.truck === m.truck && x.j.id === m.j.id), off = !!S.gpsPaused[m.truck];
    if (!lt) { if (m.map.hasLayer(m.tm)) m.tm.remove(); return; }
    if (!off || !m.map.hasLayer(m.tm)) { const f = truckState(lt.i).f, a = m.j.pts.pickup, b = m.j.pts.dropoff; m.tm.setLatLng([a.lat + (b.lat - a.lat) * f, a.lng + (b.lng - a.lng) * f]); }
    m.tm.setStyle({ fillColor: off ? m.off : m.on }); if (!m.map.hasLayer(m.tm)) m.tm.addTo(m.map);
  });
  document.querySelectorAll("[data-clock]").forEach(el => { const sh = S.shifts[el.dataset.clock]; if (sh) el.textContent = dur(workMs(sh)); });
  document.querySelectorAll("[data-gps]").forEach(el => { el.textContent = gpsText(el.dataset.gps); });
}

/* ---------- Driver (drives a truck for an owner) ---------- */
const ME_DRIVER = "Marco Ruiz";   // the driver we view as; their truck follows the owner's Fleet tab
const myDriverTruck = () => MY_TRUCKS.find(t => S.driverOf[t.id] === ME_DRIVER);
const driverAssignments = () => { const t = myDriverTruck(); return t ? S.jobs.flatMap(j => j.assignments.filter(a => a.truck === t.id).map(a => ({ j, a }))) : []; };
function driverHead(title) {
  const t = myDriverTruck();
  return `<div class="stack" style="gap:4px"><span class="eyebrow">${ME_DRIVER} · driving for ${ME_OWNER}${t ? " · " + t.id : ""}</span><h1>${title}</h1></div>`;
}
/* Clock in / clock out: the driver's paid day. Hours go to the job when they clock out. */
const breakMs = (sh, until) => sh.breaks.reduce((s, b) => s + ((b.e || until) - b.s), 0);
const workMs = sh => { const end = sh.outMs || demoNow(); return Math.max(0, end - sh.inMs - breakMs(sh, end)); };
const dur = ms => `${Math.floor(ms / 3.6e6)} h ${String(Math.floor(ms / 60000) % 60).padStart(2, "0")} m`;
const onBreak = sh => sh.breaks.length > 0 && !sh.breaks[sh.breaks.length - 1].e;
const shiftHours = sh => Math.max(0.25, Math.round(workMs(sh) / 900000) / 4);   // nearest quarter hour
const todayFor = truck => S.jobs.filter(j => j.date === "Today").flatMap(j => j.assignments.filter(a => a.truck === truck).map(a => ({ j, a })));
function shiftSum(sh) {
  const end = sh.outMs || demoNow();
  return `<div class="sum"><div class="row"><span>Clocked in</span><span class="num">${fmtT(sh.inMs)}</span></div>
    <div class="row"><span>Clocked out</span><span class="num">${sh.outMs ? fmtT(sh.outMs) : fmtT(end) + " (now)"}</span></div>
    <div class="row"><span>Breaks, unpaid</span><span class="num">${dur(breakMs(sh, end))}</span></div>
    <div class="row total"><span>Paid time</span><span class="num">${dur(workMs(sh))} · ${shiftHours(sh)} hrs</span></div></div>`;
}
function shiftLine(truck) {
  const sh = S.shifts[truck]; if (!sh) return "";
  const parts = [`Clocked in ${fmtT(sh.inMs)}`, sh.breaks.length ? `breaks ${dur(breakMs(sh, sh.outMs || demoNow()))}` : "", sh.outMs ? `out ${fmtT(sh.outMs)} · signed by ${esc(sh.sign)}` : "still on the clock"].filter(Boolean);
  return `<div class="muted num" style="font-size:13px">${parts.join(" · ")}</div>${sh.far ? `<span class="pill warn" style="justify-self:start">Clocked in ${esc(sh.where)}</span>` : ""}${sh.correction ? `<div class="note">Correction asked: "${esc(sh.correction.text)}"</div>` : ""}`;
}
function clockCard(t) {
  const sh = S.shifts[t.id];
  if (!sh) return `<div class="card" style="border:2px solid var(--good)"><span class="eyebrow">Start your day</span><h2>You're not clocked in</h2>
    <button class="btn good" type="button" data-act="clock-in:${t.id}">Clock in</button>
    <p class="muted" style="font-size:12.5px">Saves the time and your GPS location, and turns GPS on for the day.</p>
    <button class="btn small ghost" type="button" data-act="clock-in:${t.id}:far" style="justify-self:start">Demo: clock in from home</button></div>`;
  if (sh.outMs) {
    const corr = sh.correction;
    return `<div class="card"><div class="row"><span class="eyebrow">Day done · signed by ${esc(sh.sign)}</span>${corr ? '<span class="pill warn">Correction asked</span>' : '<span class="pill good">Clocked out</span>'}</div>
      ${shiftSum(sh)}
      ${corr ? `<div class="note">You asked: "${esc(corr.text)}" (${esc(corr.time)}). ${ME_OWNER} and the contractor will fix it and approve.</div>`
        : ui.corr ? `<label class="field">What needs fixing?<textarea id="corr-text" rows="2" placeholder="e.g. I forgot to clock out. I left the site at 2:30 PM."></textarea></label>
          <div class="row" style="gap:8px"><button class="btn small" type="button" data-act="corr-send:${t.id}" style="flex:1">Send</button><button class="btn small ghost" type="button" data-act="corr-cancel" style="flex:1">Cancel</button></div>`
        : `<button class="btn small ghost" type="button" data-act="corr-open" style="justify-self:start">Ask for a correction</button>`}
      <p class="muted" style="font-size:12.5px">Times can't be changed after you clock out. Corrections go to ${ME_OWNER} and the contractor.</p>
      <button class="btn small ghost" type="button" data-act="clock-reset:${t.id}" style="justify-self:start">Demo: start a new day</button></div>`;
  }
  const brk = onBreak(sh);
  return `<div class="card" style="border:2px solid ${brk ? "var(--warn)" : "var(--good)"}">
    <div class="row"><span class="eyebrow">Clocked in ${fmtT(sh.inMs)} · ${esc(sh.where)}</span>${brk ? '<span class="pill warn">On break</span>' : '<span class="pill good">On the clock</span>'}</div>
    <div class="big" data-clock="${t.id}">${dur(workMs(sh))}</div>
    ${sh.far ? `<div class="note" style="color:var(--warn)">You clocked in ${esc(sh.where)}, so your time is flagged for the contractor.</div>` : ""}
    ${brk ? `<p class="muted" style="font-size:13px">Break started at ${fmtT(sh.breaks[sh.breaks.length - 1].s)}. Break time isn't paid.</p>` : ""}
    <div class="grid2"><button class="btn ${brk ? "" : "ghost"}" type="button" data-act="${brk ? "break-end" : "break-start"}:${t.id}">${brk ? "End break" : "Start break"}</button><button class="btn ghost" type="button" data-go="clockout">Clock out</button></div></div>`;
}
function driverClockOut() {
  const t = myDriverTruck(), sh = t && S.shifts[t.id];
  if (!sh || sh.outMs) { ui.view = null; return driverToday(); }
  const today = todayFor(t.id), loads = today.reduce((s, x) => s + x.a.tickets.length, 0), tn = today.reduce((s, x) => s + tons(x.a), 0);
  return `<button class="back" type="button" data-go="back">‹ Today</button>

    <div class="card">${shiftSum(sh)}</div>

    ${today.length ? `<div class="note">Did you add every load ticket? ${today.map(({ j, a }) => `<button class="back" type="button" data-go="work:${j.id}:${a.truck}" style="display:inline;font-size:12.5px">Add one to ${esc(j.name)}</button>`).join(" ")}</div>` : ""}

  const mine = driverAssignments().filter(x => x.j.date !== "Yesterday");

      <div class="row"><span class="eyebrow">${esc(j.date)} · ${esc(j.start)} · ${esc(a.truck)}</span>${statusPill(a)}</div>
      <h2>${esc(j.name)}</h2>${n ? `<span class="pill warn" style="justify-self:start">${n} new dispatch note${n > 1 ? "s" : ""}</span>` : ""}${jobMap(j, { truck: a.truck, h: 160 })}${route(j)}

  return driverHead("Hours and loads") + `<div class="stats"><div class="stat"><span>Loads today</span><div class="big">${today.reduce((s, x) => s + x.a.tickets.length, 0)}</div></div>

/* ---------- Broker ---------- */
const B = () => S.broker;
const bTruck = id => B().roster.find(t => t.id === id);
const bNeed = j => Object.values(j.needs).reduce((a, b) => a + b, 0);
const bFilled = j => Object.values(j.assigned).reduce((a, b) => a + b.length, 0);
const bDispatched = () => B().jobs.reduce((s, j) => s + bFilled(j), 0);
function bBusy(date) {
  const ids = new Set(B().jobs.filter(j => j.date === date).flatMap(j => Object.values(j.assigned).flat()));
  S.jobs.filter(j => j.date === date).forEach(j => j.assignments.forEach(a => ids.add(a.truck)));
  return ids;
}
const docsPill = d => d === "good" ? '<span class="pill good">Verified</span>' : d === "expiring" ? '<span class="pill warn">Expiring</span>' : '<span class="pill bad">Blocked</span>';

function brokerBoard() {
  const card = j => { const pct = Math.round(100 * bFilled(j) / Math.max(1, bNeed(j)));
    return `<button type="button" class="card tap" data-go="bjob:${j.id}">
      <div class="row"><span class="eyebrow">${esc(j.date)} · ${esc(j.start)}</span>${bFilled(j) >= bNeed(j) ? '<span class="pill good">All dispatched</span>' : `<span class="pill warn">${bNeed(j) - bFilled(j)} to dispatch</span>`}</div>
      <h2>${esc(j.name)}</h2><p class="muted" style="font-size:14px">${esc(j.customer)} · ${esc(j.kind)}</p>
      <div class="meter"><i style="width:${pct}%"></i></div>
      <div class="row"><div class="chips">${Object.keys(TYPES).filter(t => j.needs[t]).map(t => `<span class="chip">${TYPES[t].short} ${j.assigned[t].length}/${j.needs[t]}</span>`).join("")}</div><span class="muted num" style="font-size:13px">${bFilled(j)} of ${bNeed(j)} trucks</span></div></button>`; };
  const open = S.jobs.filter(j => !j.approved && j.date !== "Yesterday" && filled(j) < needed(j));
  return `<div class="stack" style="gap:4px"><span class="eyebrow">${esc(B().name)}</span><h1>Dispatch board</h1></div>
    <p class="muted">Your customers' jobs. Pick a truck and the driver gets the job details by text, no phone calls.</p>
    ${B().jobs.map(card).join("")}
    ${open.length ? `<p class="eyebrow">Open jobs from Trucks2U contractors</p>${open.map(j => `<button type="button" class="card tap" data-go="tjob:${j.id}">
      <div class="row"><span class="eyebrow">${esc(j.date)} · ${esc(j.start)}</span><span class="pill info">${needed(j) - filled(j)} trucks wanted</span></div>
      <h2>${esc(j.name)}</h2><div class="chips">${jobFillChips(j)}</div></button>`).join("")}` : ""}`;
}

function slotPicker(date, type, act) {
  const busy = bBusy(date);
  const free = B().roster.filter(t => t.type === type && !busy.has(t.id) && t.docs !== "bad");
  if (!free.length) return '<span class="muted" style="font-size:13px">No free verified trucks of this type</span>';
  const sid = "pick-" + act.replace(/:/g, "-");
  return `<div class="row" style="gap:8px"><select id="${sid}" aria-label="Choose a truck" style="flex:1;min-width:0">${free.map(t => `<option value="${t.id}">${t.id} · ${esc(t.driver)}${t.docs === "expiring" ? " (docs expiring)" : ""}</option>`).join("")}</select>
    <button class="btn small" type="button" data-act="${act}" data-pick="${sid}" style="flex:none">Dispatch</button></div>`;
}

function brokerJob(j) {
  const sections = Object.keys(TYPES).filter(t => j.needs[t]).map(t => {
    const rows = j.assigned[t].map(id => { const tr = bTruck(id); return `<div class="row"><div class="row" style="justify-content:flex-start"><span class="truck-ic">${TYPES[t].short}</span><div><strong>${id} · ${esc(tr.driver)}</strong><div class="muted" style="font-size:13px">${esc(tr.owner)}</div></div></div>
      <button class="btn small ghost" type="button" data-act="bun:${j.id}:${t}:${id}">Remove</button></div>`; }).join("");
    const left = j.needs[t] - j.assigned[t].length;
    return `<div class="card"><div class="row"><h2>${TYPES[t].name}</h2><span class="muted num">${j.assigned[t].length} of ${j.needs[t]}</span></div>
      <div class="list">${rows}${left > 0 ? `<div>${slotPicker(j.date, t, `bdis:${j.id}:${t}`)}</div>` : ""}</div></div>`;
  }).join("");
  return `<button class="back" type="button" data-go="back">‹ Dispatch board</button>
    <div class="stack" style="gap:4px"><span class="eyebrow">${esc(j.id)} · ${esc(j.date)} · start ${esc(j.start)}</span><h1>${esc(j.name)}</h1><p class="muted">${esc(j.customer)} · ${esc(j.kind)}</p></div>

}

function brokerT2Job(j) {
  const sections = Object.keys(TYPES).filter(t => j.needs[t] > filled(j, t)).map(t => `<div class="card"><div class="row"><h2>${TYPES[t].name}</h2><span class="muted num">$${j.rate[t]}/hr · ${j.needs[t] - filled(j, t)} open</span></div>${slotPicker(j.date, t, `tdis:${j.id}:${t}`)}</div>`).join("");

    <div class="stack" style="gap:4px"><span class="eyebrow">Trucks2U contractor job · ${esc(j.date)} · ${esc(j.start)}</span><h1>${esc(j.name)}</h1><p class="muted">${esc(j.kind)}</p></div>

}

function brokerTrucks() {
  const busy = bBusy("Today");
  return `<h1>Your trucks</h1><p class="muted">Owner-operators you dispatch. Each one goes through the same Trucks2U vetting; a blocked truck can't be dispatched until its documents are current.</p>
    <div class="card"><div class="list">${B().roster.map(t => `<div class="row"><div class="row" style="justify-content:flex-start"><span class="truck-ic">${TYPES[t.type].short}</span><div><strong>${t.id} · ${esc(t.driver)}</strong><div class="muted" style="font-size:13px">${esc(t.owner)} · ${busy.has(t.id) ? "Working today" : "Free today"}</div></div></div>${docsPill(t.docs)}</div>`).join("")}</div></div>

function submitSignup() {
  const su = ui.signup, f = su.f, F = su.files, id = "A" + (S.applicants.length + 1);
  const fileNote = k => F[k] ? "Uploaded: " + F[k].name : "Not uploaded";
  const fmtD = d => { const x = new Date(d + "T12:00:00"); return isNaN(x) ? d : x.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
  f.coiExp = fmtD(f.coiExp); f.cdlExp = fmtD(f.cdlExp);
  S.applicants.unshift({ id, name: f.biz, trucks: "one " + TYPES[f.ttype].name.toLowerCase(), fresh: true, checks: [
    [`USDOT ${f.usdot} active, no out-of-service order`, su.dot ? "good" : "warn", su.dot ? "Checked automatically" : "Not checked yet", null],
    [`Commercial auto liability, ${f.liab}`, "warn", `Expires ${f.coiExp} · needs review`, F.coi],
    ["Insurance ID card", "warn", fileNote("insCard") + (F.insCardBack ? " (front and back)" : ""), F.insCard],
    ["Workers' comp", "warn", f.wcExempt ? "Sole-owner exemption, needs review" : fileNote("wc"), F.wc],
    [`CDL ${f.cdlClass}, expires ${f.cdlExp}`, "warn", "License photo uploaded · MVR check running", F.cdlFront],
    ["DOT medical card", "warn", fileNote("med"), F.med],
    ["Drug testing program and Clearinghouse", "warn", "Consortium letter uploaded · Clearinghouse consent given", F.drug],
    [`Truck registration and annual inspection (plate ${f.plate})`, "warn", "Registration and inspection uploaded", F.reg],
    ["W-9 and payout bank account", f.bank && F.w9 ? "good" : "warn", f.bank ? "Bank connected" + (F.w9 ? ", W-9 on file" : ", W-9 still needed") : "Bank not connected yet", F.w9]
  ] });
  su.done = true;
}

  }
  if (ui.role === "owner") {
    if (v && v.startsWith("work:")) { const [, jid, t] = v.split(":"); const j = job(jid); return ownerWork(j, j.assignments.find(a => a.truck === t)); }

    return { dtoday: driverToday, dhours: driverHours, dme: driverMe }[ui.tab]();
  }
  if (ui.role === "broker") {

// Prototype only: other drivers on the app accept a new job one by one, leaving a spot for you to try.
const OTHER_DRIVERS = [["R&J Trucking", "R-8"], ["Bautista Transport", "B-2"], ["Ortega Trucking", "O-4"], ["Moreno Bros", "M-6"], ["Kowalski & Sons", "K-3"], ["Hill Country Haul", "H-1"], ["Patel Freight", "PF-2"], ["Reyes Hauling", "RH-5"]];
function simulateAccepts(id) {
  const step = () => {
    const j = job(id); if (!j) return;
    const open = Object.keys(TYPES).filter(t => j.needs[t] > filled(j, t));
    if (needed(j) - filled(j) <= 1 || !open.length) return;
    const t = open[Math.floor(Math.random() * open.length)];
    const [owner, tk] = OTHER_DRIVERS[j.assignments.length % OTHER_DRIVERS.length];
    j.assignments.push({ truck: tk + "-" + j.assignments.length, type: t, owner, status: "assigned", checkIn: null, hours: null, tickets: [] });
    if (ui.role === "contractor") toast(`${owner} accepted (${TYPES[t].name}). ${filled(j)} of ${needed(j)} filled.`);
    const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
    if (!ui.draft && !ui.dspEdit && !typing && !ui.view?.startsWith("work:") && ui.tab !== "plants") render();
    setTimeout(step, 3500);
  };
  setTimeout(step, 3000);
}

      return;

    case "driver": { const t = MY_TRUCKS.find(x => x.id === arg1); t.type = $("#typ-" + arg1).value; S.driverOf[arg1] = pick;
      toast(`Saved. ${arg1} is a ${TYPES[t.type].name.toLowerCase()}, driven by ${pick}.`); break; }
    case "suggest": toast("In the full app this sends your correction to Trucks2U to check."); return;
    case "reject": { const a = S.applicants.find(x => x.id === arg1); a.checks[+arg2][1] = "bad"; a.checks[+arg2][2] = "Rejected. The owner got a text asking for a new document."; toast("Rejected. The owner was asked to upload a new one."); break; }
    case "su-start": ui.signup = newSignup(); break;
    case "su-close": ui.signup = null; break;
    case "su-next": ui.signup.step++; break;
    case "su-prev": ui.signup.step--; break;
    case "su-dot": { const n = (ui.signup.f.usdot || "").replace(/\D/g, ""); if (n.length < 6) { toast("Enter your USDOT number first."); return; } ui.signup.dot = `✓ USDOT ${n} is active, authorized for property, no out-of-service order. (Sample result; the real app asks FMCSA.)`; break; }
    case "su-bank": ui.signup.f.bank = true; toast("Bank connected (sample)."); break;
    case "su-submit": submitSignup(); toast("Sent for review."); break;
    case "su-admin": { const id = S.applicants[0].id; ui = { role: "admin", tab: "vet", view: "app:" + id, draft: null }; break; }
    case "st-save": syncSettings(); toast("Settings saved."); break;
    case "st-add": { syncSettings(); const k = "x" + Date.now().toString(36);
      TYPES[k] = { name: "New truck type", short: "NEW", spec: "", tons: 20, rate: 140 }; toast("Added. Fill in the details and save."); break; }
    case "st-del": { syncSettings();
      if (Object.keys(TYPES).length <= 1) { toast("Keep at least one truck type."); return; }
      if (typeInUse(arg1)) { toast(`${TYPES[arg1].name} is used by trucks or jobs, so it can't be removed.`); return; }
      const nm = TYPES[arg1].name; delete TYPES[arg1]; toast(`${nm} removed.`); break; }
    case "st-kadd": { const v = $("#st-kind-new").value.trim(); if (!v) { toast("Type the new job type first."); return; }
      syncSettings(); KINDS.push(v); toast(`Added "${v}".`); break; }
    case "st-kdel": syncSettings(); KINDS.splice(+arg1, 1); toast("Job type removed."); break;
    case "approve-app": S.approvedApplicants.push(arg1); ui.view = null; toast("Approved. The owner can now accept jobs."); break;
  }
  render();
}

});
// Phone fields format themselves as (510) 555-0142 while you type.
function fmtPhone(v) {
  const d = v.replace(/\D/g, "").replace(/^1/, "").slice(0, 10);   // US numbers; a leading 1 is dropped
  if (d.length <= 3) return d;
  if (d.length <= 6) return `(${d.slice(0, 3)}) ${d.slice(3)}`;
  return `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`;
}
document.addEventListener("input", e => {
  const el = e.target; if (!el.hasAttribute || !el.hasAttribute("data-phone")) return;
  const digitsBefore = el.value.slice(0, el.selectionStart).replace(/\D/g, "").replace(/^1/, "").length;
  el.value = fmtPhone(el.value);
  let pos = 0, seen = 0;   // put the cursor back after the same digit
  while (pos < el.value.length && seen < digitsBefore) { if (/\d/.test(el.value[pos])) seen++; pos++; }
  el.setSelectionRange(pos, pos);
}, true);
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.f;
  if (k && ui.signup) ui.signup.f[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
});
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.f;
  if (k && ui.signup) { ui.signup.f[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value; if (e.target.type === "checkbox" && ui.signup.step === 5) render(); }
  const fk = e.target.dataset && e.target.dataset.file;
  if (fk && ui.signup && e.target.files[0]) {
    const file = e.target.files[0], su = ui.signup;
    if (file.type.startsWith("image/")) { const r = new FileReader(); r.onload = () => { su.files[fk] = { name: file.name, url: r.result }; render(); }; r.readAsDataURL(file); }
    else { su.files[fk] = { name: file.name, url: null }; render(); }
  }
  if (ui.draft && (e.target.id === "f-plant" || e.target.id === "f-kind")) { syncDraft(); render(); }
  if (e.target.id && e.target.id.startsWith("st-") && e.target.id !== "st-kind-new") syncSettings();   // settings edits stick even without pressing Save
  if (e.target.id === "pl-q") { ui.plq = e.target.value; render(); }
  if (e.target.id === "pl-from") { ui.from = e.target.value; SITE = FROM[ui.from]; render(); }
});
document.addEventListener("input", e => {
  if (ui.draft && e.target.id === "f-site") {
    ui.draft.site = e.target.value;
    const b = $("[data-act=post]"), n = Object.values(ui.draft.needs).reduce((a, c) => a + c, 0); if (b) b.disabled = !e.target.value.trim() || !n;
  }

});

// Phone or computer layout; remembered in this browser only.
function setLayout(l) {
  document.documentElement.dataset.layout = l;
  document.querySelectorAll("[data-lay]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lay === l));
  try { localStorage.setItem("t2u-layout", l); } catch (e) {}
}
document.querySelectorAll("[data-lay]").forEach(b => b.addEventListener("click", () => setLayout(b.dataset.lay)));
let savedLayout = "phone";
try { savedLayout = localStorage.getItem("t2u-layout") || "phone"; } catch (e) {}
