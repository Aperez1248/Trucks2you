<html lang="en">
<head>

<script>try { var l = localStorage.getItem("t2u-layout"); document.documentElement.dataset.layout = (l === "wide" && innerWidth > 600) ? "wide" : "phone"; } catch (e) { document.documentElement.dataset.layout = "phone"; }</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: demo bar on top (Phone/Computer, Viewing as, Reset demo), then the app:
   navy brand bar, the screen, and a bottom tab bar (a left sidebar in Computer layout). */
:root {
  /* Black and white, like the original app; color only where it means something (status, map) */
  --bg: #f3f3f3;          /* page around the phone frame on computers */
  --surface: #ffffff;
  --surface-2: #f3f3f3;   /* light gray fills: secondary buttons, chips, icon circles */
  --line: #e8e8e8;
  --fg: #000000;
  --muted: #5e5e5e;
  --brand: #000000;
  --brand-2: #1c1c1c;
  --brand-fg: #ffffff;
  --accent: #000000;
  --accent-fg: #ffffff;
  --accent-soft: #eeeeee;
  --route: #276ef1;   /* map routes and truck dots */
  --good: #06a35a;
  --good-soft: #e3f6ec;
  --warn: #c76a00;
  --warn-soft: #fdf0dc;
  --bad: #e11900;
  --bad-soft: #fde6e3;
  --display: "Figtree", "Helvetica Neue", Arial, sans-serif;
  --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
  --tabh: 62px;   /* bottom tab bar height (phone layout) */
}
/* Always the white look, even when the phone is in dark mode (the owner prefers white).
   The dark colors below only apply if a page explicitly sets data-theme="dark". */
:root { color-scheme: light; }
:root[data-theme="dark"] {
  --bg: #0b0b0b; --surface: #161616; --surface-2: #111111; --line: #2c2c2c;
  --fg: #ffffff; --muted: #a6a6a6; --brand: #000000; --brand-2: #1c1c1c; --brand-fg: #ffffff;
  --accent: #ffffff; --accent-fg: #000000; --accent-soft: #262626; --route: #5b93ff;
  --good: #1fd47f; --good-soft: #0f2a1c; --warn: #f0a640; --warn-soft: #33240c;
  --bad: #ff6b5b; --bad-soft: #3a1512; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
button, label, a { touch-action: manipulation; }   /* no double-tap zoom delay on buttons */
.wrap { max-width: 460px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: max(12px, env(safe-area-inset-top, 0px)) 24px; display: grid; gap: 12px; }
/* overflow: clip (not hidden) rounds the corners without breaking the sticky tab bar and buttons */
.app { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: clip; display: flex; flex-direction: column; min-height: 640px; }
.bar { background: var(--surface); color: var(--fg); border-bottom: 1px solid var(--line); padding: 14px 16px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { font: 800 24px/1 var(--display); letter-spacing: -.5px; }
.logo b { color: inherit; }
.bar small { font: 600 11px/1.2 var(--body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); text-align: right; }
.demo { display: grid; gap: 6px; }
.roles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.roles button { border: 0; background: transparent; color: var(--muted); font: 600 13px/1.2 var(--body); padding: 9px 2px; min-height: 38px; border-radius: 9px; cursor: pointer; }
.roles button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.roles-label { font: 600 11px/1 var(--body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.roles-label button { background: none; border: 0; color: var(--accent); font: inherit; letter-spacing: inherit; cursor: pointer; padding: 6px 0; }
main { flex: 1; padding: 16px; display: grid; gap: 14px; align-content: start; min-width: 0; }
h1 { font: 800 26px/1.15 var(--display); margin: 0; letter-spacing: -.4px; text-wrap: balance; }
h2 { font: 700 19px/1.2 var(--display); margin: 0; letter-spacing: -.2px; }
.eyebrow { font: 600 11px/1.2 var(--body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card.tap { cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.card.tap:hover { border-color: var(--accent); }
.card.hot { border: 2px solid var(--accent); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.row > * { min-width: 0; }
.stack { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 12px/1 var(--body); padding: 5px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid transparent; color: var(--fg); white-space: nowrap; }
/* Choice chips (job type, distance, day): big enough for a gloved thumb */
.pick { font: 600 14px/1 var(--body); min-height: 38px; padding: 10px 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); cursor: pointer; }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.pill { font: 700 11px/1 var(--body); letter-spacing: .6px; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.btn { border: 0; border-radius: 11px; background: var(--accent); color: var(--accent-fg); font: 700 15px/1 var(--body); padding: 13px 16px; min-height: 44px; cursor: pointer; width: 100%; }
.btn.ghost { background: var(--surface-2); color: var(--fg); border: 1px solid transparent; }
.btn.small { width: auto; padding: 9px 12px; min-height: 38px; font-size: 13px; border-radius: 9px; }
.btn.good { background: var(--good); color: #ffffff; }
:root[data-theme="dark"] .btn.good { color: #000000; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.btn:focus-visible, .roles button:focus-visible, .tabs button:focus-visible, .card.tap:focus-visible, .pick:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.back { background: none; border: 0; color: var(--accent); font: 600 14px/1 var(--body); padding: 0; min-height: 38px; cursor: pointer; justify-self: start; text-align: left; }
/* The main action stays pinned at the bottom while a long screen scrolls */
.pin { position: sticky; bottom: calc(var(--tabh) + 10px + env(safe-area-inset-bottom, 0px)); z-index: 4; box-shadow: 0 0 0 8px var(--surface-2); }
.notabs .pin { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.big { font: 700 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 4px; min-width: 0; }
.stat .big { font-size: 22px; }
.stat span { font-size: 12px; color: var(--muted); }
.meter { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.route { display: grid; grid-template-columns: 14px 1fr; gap: 2px 10px; font-size: 14px; }
.route .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--route); margin-top: 5px; }
.route .dot.end { background: var(--route); }
.route .line { width: 2px; background: var(--line); margin-left: 4px; height: 14px; }
.list { display: grid; gap: 0; }
.list > div, .list > button.place { padding: 10px 0; border-top: 1px solid var(--line); }
.list > div:first-child, .list > button.place:first-child { border-top: 0; padding-top: 0; }
.truck-ic { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; font: 700 13px/1 var(--display); }
.thumb { width: 44px; height: 44px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); object-fit: cover; flex: none; display: grid; place-items: center; font-size: 10px; color: var(--muted); }
label.field { display: grid; gap: 6px; font: 600 13px/1.2 var(--body); color: var(--muted); min-width: 0; }
input, select, textarea { width: 100%; font: 500 15px/1.3 var(--body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-height: 44px; }
input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); flex: none; }
input[type="file"] { padding: 8px; font-size: 14px; }
textarea { resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps i { height: 4px; border-radius: 4px; background: var(--line); }
.steps i.on { background: var(--accent); }
.typecount { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 700 18px/1 var(--body); cursor: pointer; }
.stepper output { width: 28px; text-align: center; font: 700 18px/1 var(--display); }
.trip { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.sum { display: grid; gap: 6px; font-size: 14px; }
.sum .row { padding: 2px 0; }
.sum .total { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 700; }
.check { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; }
.check .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--body); margin-top: 1px; }
.mark.good { background: var(--good-soft); color: var(--good); }
.mark.warn { background: var(--warn-soft); color: var(--warn); }
.mark.bad { background: var(--bad-soft); color: var(--bad); }
.tick { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; min-height: 38px; padding: 6px 0; }
.tick input { margin-top: 0; }
.note { font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; }
.msg { font-size: 14px; background: var(--surface-2); border-radius: 10px; padding: 9px 12px; }
/* A list row you can tap (places, jobs on the board) */
.place { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; color: var(--fg); font: inherit; cursor: pointer; min-height: 44px; }
.place b { display: block; font-weight: 600; }
.place span span { display: block; font-size: 13px; color: var(--muted); }
.place .pin-ic { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; flex: none; color: var(--accent); }
.stars { display: flex; gap: 2px; }
.stars button { background: none; border: 0; font-size: 30px; line-height: 1; color: var(--line); cursor: pointer; padding: 4px; min-width: 38px; min-height: 38px; }
.stars button.on { color: var(--warn); }
/* Phone numbers are tap-to-call links; the padding makes them easy to hit without moving the text */
a.tel { color: var(--accent); font-weight: 600; text-decoration: none; white-space: nowrap; display: inline-block; padding: 9px 0; margin: -9px 0; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); position: sticky; bottom: 0; z-index: 6; }
.tabs[hidden] { display: none; }
.tabs button { background: none; border: 0; color: var(--muted); font: 600 11.5px/1.1 var(--body); padding: 10px 2px 8px; min-height: 56px; display: grid; justify-items: center; align-content: center; gap: 4px; cursor: pointer; position: relative; min-width: 0; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs svg { width: 22px; height: 22px; }
.tabs .dot { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font: 700 11px/17px var(--body); }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--brand); color: var(--brand-fg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; width: max-content; max-width: calc(100% - 32px); z-index: 40; text-align: center; box-shadow: 0 6px 24px rgb(0 0 0 / .25); }
/* Same-day request: a dark card over the screen with a 20-second countdown */
.offer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabh) + 12px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 20px)); max-height: calc(100% - 100px); overflow-y: auto; z-index: 30; background: var(--brand); color: #fff; border-radius: 18px; padding: 18px; display: grid; gap: 12px; box-shadow: 0 10px 40px rgb(0 0 0 / .45); }
.offer .muted { color: #b3b3b3; }
.offer .btn.ghost { background: var(--brand-2); color: #fff; border-color: #333333; }
.ring { width: 56px; height: 56px; flex: none; }
.map { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.map .road { fill: none; stroke: var(--line); stroke-width: 9; stroke-linecap: round; }
.map .road2 { fill: none; stroke: var(--surface); stroke-width: 2; stroke-dasharray: 6 6; }
.map .fence { fill: var(--good-soft); stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 4 3; }
.map .place { fill: var(--fg); font: 700 11px var(--body); }
.map .tk { fill: var(--route); stroke: var(--surface); stroke-width: 2; }
.map .tk.in { fill: var(--good); }
.map .tk.off { fill: var(--muted); }
.gmap .land { fill: var(--surface-2); }
.gmap .grid { stroke: var(--line); stroke-width: .6; }
.gmap .city { fill: var(--muted); }
.gmap .cityl { fill: var(--muted); font: 600 9.5px var(--body); }
.gmap .plantdot { fill: var(--muted); opacity: .55; }
.gmap .leg { fill: none; stroke: var(--route); stroke-width: 3; stroke-dasharray: 7 5; stroke-linecap: round; }
.gmap .pinA { fill: var(--good); stroke: var(--surface); stroke-width: 1.5; }
.gmap .pinB { fill: var(--route); stroke: var(--surface); stroke-width: 1.5; }
.gmap .pinl { fill: var(--fg); font: 700 10.5px var(--body); paint-order: stroke; stroke: var(--surface-2); stroke-width: 3px; }
.gmap .scale { stroke: var(--fg); stroke-width: 1.5; }
.gmap .scalel { fill: var(--fg); font: 600 9px var(--body); }
.map .tl { fill: var(--fg); font: 700 10px var(--body); }
.stage { font-size: 12.5px; color: var(--muted); }
/* Leaflet stacks its layers up to z-index 1000; keep them inside the map so they never cover the tab bar or pinned buttons */
.mapbox { isolation: isolate; z-index: 0; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .card.tap { transition: border-color .15s; } }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
/* Computer view: wider page, tabs move to a left sidebar, cards sit side by side. */
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; justify-self: center; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 600 13px/1.2 var(--body); padding: 8px 18px; min-height: 38px; border-radius: 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-fg); }
.seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
:root[data-layout="wide"] .wrap { max-width: 1180px; }
:root[data-layout="wide"] .app { display: grid; grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: auto 1fr; grid-template-areas: "bar bar" "side main"; min-height: 720px; }
:root[data-layout="wide"] .bar { grid-area: bar; padding: 16px 22px; }
:root[data-layout="wide"] main { grid-area: main; padding: 22px; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); align-items: start; }
:root[data-layout="wide"] main > * { grid-column: 1 / -1; }
:root[data-layout="wide"] main > .card { grid-column: auto; }
:root[data-layout="wide"] main.form { grid-template-columns: minmax(0, 680px); }
:root[data-layout="wide"] main.form > .card { grid-column: 1 / -1; }
:root[data-layout="wide"] .tabs { grid-area: side; position: static; grid-auto-flow: row; grid-auto-columns: auto; grid-auto-rows: max-content; align-content: start; gap: 2px; border-top: 0; border-right: 1px solid var(--line); padding: 14px 10px; }
:root[data-layout="wide"] .tabs button { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 10px 12px; min-height: 42px; border-radius: 9px; text-align: left; }
:root[data-layout="wide"] .tabs button[aria-current="page"] { background: var(--accent-soft); }
:root[data-layout="wide"] .tabs svg { width: 20px; height: 20px; flex: none; }
:root[data-layout="wide"] .tabs .dot { position: static; margin-left: auto; }
:root[data-layout="wide"] .notabs main { grid-column: 1 / -1; }
:root[data-layout="wide"] .pin { bottom: 16px; }
:root[data-layout="wide"] .toast, :root[data-layout="wide"] .offer { bottom: 24px; }
@media (max-width: 640px) {
  :root[data-layout="wide"] .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "main" "side"; }
  :root[data-layout="wide"] .tabs { position: sticky; grid-auto-flow: column; grid-auto-columns: 1fr; border-right: 0; border-top: 1px solid var(--line); padding: 0 0 env(safe-area-inset-bottom, 0px); }
  :root[data-layout="wide"] .tabs button { display: grid; justify-items: center; gap: 4px; font-size: 11.5px; padding: 10px 2px 8px; }
}
/* ---------- Real phones: the app fills the screen edge to edge, like a native app ---------- */
@media (max-width: 600px) {
  .wrap { max-width: none; padding: 0; gap: 0; }
  .seg, .foot { display: none; }
  /* Compact "Viewing as" bar at the very top, clear of the notch */
  .demo { gap: 4px; padding: calc(6px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
  .roles { border: 0; padding: 0; gap: 3px; }
  .roles button { font-size: 12px; padding: 4px 1px; }
  .roles-label { font-size: 10px; }
  .roles-label button { padding: 2px 0; }
  .app { border: 0; border-radius: 0; min-height: calc(100vh - 66px); min-height: calc(100dvh - 66px - env(safe-area-inset-top, 0px)); }
  .bar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  /* Text boxes at 16px or more, so iPhones don't zoom in when you tap them */
  input, select, textarea { font-size: 16px !important; }
}
/* ---------- Uber-style polish ----------
   Gray tiles instead of outlined white boxes, big bold type, white pills with soft shadows,
   and a compact "Viewing as" menu in the header. */
:root { --tile: #f3f3f3; --shadow: 0 2px 12px rgb(0 0 0 / .12); }
/* Cards become solid light-gray tiles with no outline. Inside a tile, the things that were
   light gray (chips, secondary buttons, icon circles) flip to white so they still stand out. */
.card, .stat { background: var(--tile); border: 0; border-radius: 16px; padding: 16px; --surface-2: #ffffff; --line: #e2e2e2; }
.card.tap:hover { border-color: transparent; box-shadow: inset 0 0 0 2px var(--fg); }
.card.hot { border: 0; box-shadow: inset 0 0 0 2px var(--fg); }
.card .meter, .stat .meter { background: #e2e2e2; border: 0; }
.meter { height: 6px; border: 0; background: #e8e8e8; }
.card .pill.info { background: #ffffff; }
.place .pin-ic { border: 0; }
/* Big, bold type: large black headings, small gray details under them */
h1 { font: 800 32px/1.08 var(--display); letter-spacing: -.9px; }
h2 { font: 800 20px/1.2 var(--display); letter-spacing: -.4px; }
.big { font: 800 32px/1 var(--display); letter-spacing: -.8px; }
.stat .big { font-size: 26px; }
.eyebrow { margin-top: 8px; }
/* Buttons: bigger and rounder, like Uber's */
.btn { min-height: 52px; font-size: 16px; border-radius: 12px; }
.btn.small { min-height: 40px; font-size: 14px; border-radius: 999px; padding: 9px 14px; }
.pick { border: 0; }
.stepper button { border: 0; background: #ffffff; box-shadow: var(--shadow); border-radius: 50%; }
/* Floating white pills with soft shadows */
.back { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); color: var(--fg); padding: 9px 16px 9px 12px; border-radius: 999px; box-shadow: var(--shadow); font-weight: 700; }
.leaflet-bar { border: 0 !important; box-shadow: var(--shadow) !important; border-radius: 999px !important; overflow: hidden; }
.leaflet-bar a { border-bottom-color: var(--line) !important; }
.mapbox, .lm { border-radius: 14px; }
.toast { border-radius: 999px; padding: 12px 20px; }
/* Header: logo on the left, the demo menu on the right; soft shadow instead of a hard line */
.bar { border-bottom: 0; box-shadow: 0 1px 0 var(--line); position: relative; z-index: 7; }
.tabs { border-top: 0; box-shadow: 0 -1px 0 var(--line), 0 -6px 16px rgb(0 0 0 / .04); }
.tabs button[aria-current="page"] { font-weight: 800; }
/* Compact "Viewing as" menu (demo only): one pill in the header that opens a small menu */
.demo { position: relative; }
.demo summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; background: var(--tile); color: var(--fg); border-radius: 999px; padding: 8px 12px 8px 14px; min-height: 38px; font: 700 14px/1 var(--body); cursor: pointer; user-select: none; }
.demo summary::-webkit-details-marker { display: none; }
.demo summary .vl { color: var(--muted); font-weight: 600; }
.demo summary svg { width: 14px; height: 14px; transition: transform .15s; }
.demo[open] summary svg { transform: rotate(180deg); }
.demo-menu { position: absolute; right: 0; top: calc(100% + 8px); width: 220px; background: var(--surface); border-radius: 16px; box-shadow: 0 10px 34px rgb(0 0 0 / .18); padding: 8px; display: grid; gap: 2px; z-index: 50; }
.demo-menu .vh { font: 600 11px/1 var(--body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); padding: 8px 10px 6px; }
.demo-menu .roles { display: grid; grid-template-columns: 1fr; gap: 2px; border: 0; padding: 0; background: none; }
.demo-menu .roles button { text-align: left; font: 600 15px/1.2 var(--body); color: var(--fg); padding: 11px 10px; min-height: 44px; border-radius: 10px; }
.demo-menu .roles button:hover { background: var(--tile); }
.demo-menu .roles button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.demo-menu #reset { margin-top: 4px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--muted); font: 600 14px/1 var(--body); text-align: left; padding: 13px 10px 8px; cursor: pointer; }
@media (max-width: 600px) {
  .demo { padding: 0; background: none; border: 0; }
  .demo summary .vl { display: none; }   /* phones: just "Contractor ▾" */
  .bar { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
  .app { min-height: 100vh; min-height: 100dvh; }
  h1 { font-size: 30px; }
}
/* ---------- Map-first home screens (Uber style) ----------
   A full-width map at the top of the screen, and a white sheet that slides up over its bottom edge. */
main { --mp: 16px; }
:root[data-layout="wide"] main { --mp: 22px; }
.hero { position: relative; margin: calc(-1 * var(--mp)) calc(-1 * var(--mp)) -38px; height: 290px; background: #e9eaec; isolation: isolate; z-index: 0; overflow: hidden; }
.hero .hm { position: absolute; inset: 0 0 38px 0; }   /* stops where the sheet starts, so Google's logo stays visible */
/* Pins on Google maps (drawn as HTML, anchored at the map point) */
.gmk { position: absolute; width: 0; height: 0; }
.gdot { position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 1px 4px rgb(0 0 0 / .35); }
.glab { position: absolute; left: 13px; top: -11px; white-space: nowrap; background: #fff; color: #000; font: 700 11px/1 var(--body); padding: 5px 7px; border-radius: 999px; box-shadow: 0 1px 4px rgb(0 0 0 / .2); }
.glab.top { left: 0; top: -36px; transform: translateX(-50%); }
.gtk { position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; }
.gtk svg { width: 26px; height: 26px; filter: drop-shadow(0 1px 2px rgb(0 0 0 / .35)); }
.gmk.pin .jobpin { position: absolute; left: 0; top: 0; }
/* Driver trip screen */
.tripmap { position: relative; margin: calc(-1 * var(--mp)) calc(-1 * var(--mp)) 0; }
.tripmap .mapbox, .tripmap .mapbox .lm, .tripmap .map { border-radius: 0; border: 0; }
.tripmap .back { position: absolute; top: 12px; left: 12px; z-index: 600; }
.tripcard { background: #000; color: #fff; border-radius: 18px; padding: 16px; display: grid; gap: 8px; box-shadow: 0 10px 30px rgb(0 0 0 / .25); position: relative; z-index: 2; }   /* sits below the map so Google's logo stays visible */
.tripcard .eyebrow { color: #b3b3b3; margin: 0; }
.tripcard h2 { font-size: 24px; color: #fff; }
.tripcard .tc-addr { color: #cfcfcf; font-size: 14px; margin-top: -4px; }
.tripcard .tc-eta { font: 700 16px/1.2 var(--body); color: #fff; }
.tripcard .tc-note { color: #b3b3b3; font-size: 13px; }
.tripcard .linkbtn { color: #fff; font-size: 13px; padding: 2px 0; }
.navbtn { width: auto; flex: none; background: var(--route) !important; color: #fff !important; padding: 14px 22px; border-radius: 999px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; }
.navpick { display: grid; gap: 8px; background: #1c1c1c; border-radius: 14px; padding: 12px; }
.navpick .btn.ghost { background: #2c2c2c; color: #fff; text-decoration: none; display: flex; align-items: center; justify-content: center; }
.gpowered { font: 600 11px/1 var(--body); color: var(--muted); text-align: right; padding-top: 8px; }
.hero .hm .leaflet-control-attribution { font-size: 9px; }
/* Muted, gray street maps (like Uber's) so black pins and the blue route stand out */
.leaflet-tile-pane { filter: grayscale(1) contrast(.88) brightness(1.06); }
.hero-top { position: absolute; z-index: 500; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
.hero-top > * { pointer-events: auto; }
.fpill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); color: var(--fg); border: 0; border-radius: 999px; padding: 9px 14px; font: 700 14px/1 var(--body); box-shadow: var(--shadow); cursor: pointer; white-space: nowrap; }
.fpill .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.sheet { position: relative; z-index: 1; background: var(--surface); border-radius: 24px 24px 0 0; margin: 0 calc(-1 * var(--mp)); padding: 10px var(--mp) 4px; display: grid; gap: 14px; align-content: start; box-shadow: 0 -8px 24px rgb(0 0 0 / .08); min-width: 0; }
.sheet::before { content: ""; width: 40px; height: 5px; border-radius: 9px; background: #d6d6d6; justify-self: center; }
/* Uber's big gray "Where to?" bar */
.whereto { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--tile); border: 0; border-radius: 14px; padding: 16px 16px; font: 700 18px/1.1 var(--body); color: var(--fg); cursor: pointer; text-align: left; min-height: 58px; }
.whereto i { width: 11px; height: 11px; background: var(--fg); flex: none; }
.whereto span { margin-left: auto; font: 600 13px/1 var(--body); background: var(--surface); border-radius: 999px; padding: 8px 12px; }
/* Truck map icons: a small top-down truck */
.tkicon svg { width: 26px; height: 26px; filter: drop-shadow(0 1px 2px rgb(0 0 0 / .35)); }
.jobpin { background: #000; color: #fff; font: 700 12px/1 var(--body); padding: 7px 10px; border-radius: 999px; white-space: nowrap; box-shadow: var(--shadow); transform: translate(-50%, -130%); position: relative; display: inline-block; }
.jobpin::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-top-color: #000; border-bottom: 0; }
.jobpin.me { background: var(--route); }
.jobpin.me::after { border-top-color: var(--route); }
/* Truck pictures */
.tpic { width: 64px; height: auto; flex: none; display: block; }
.tpic.lg { width: 120px; }
.tpic.sm { width: 50px; }
.typecount .tpic { width: 62px; }
.typecount .tline { display: flex; align-items: center; gap: 12px; min-width: 0; }
:root[data-layout="wide"] .hero { height: 340px; }
:root[data-layout="wide"] .sheet { grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); align-items: start; padding-top: 16px; }
:root[data-layout="wide"] .sheet > * { grid-column: 1 / -1; }
:root[data-layout="wide"] .sheet > .card { grid-column: auto; }
:root[data-layout="wide"] .sheet::before { display: none; }
@media (max-width: 600px) { main { --mp: 14px; } .hero { height: 270px; } }
/* ---------- Welcome screen and sign-ups ---------- */
.role-tile { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--tile); border: 0; border-radius: 16px; padding: 14px 16px; min-height: 76px; cursor: pointer; color: var(--fg); font: inherit; }
.role-tile:hover { box-shadow: inset 0 0 0 2px var(--fg); }
.rt-pic { width: 64px; height: 44px; display: grid; place-items: center; flex: none; background: #fff; border-radius: 12px; }
.rt-pic svg { width: 54px; height: auto; max-height: 38px; }
.rt-txt { display: grid; gap: 3px; min-width: 0; }
.rt-txt strong { font: 800 18px/1.15 var(--display); letter-spacing: -.3px; }
.rt-txt span { font-size: 14px; color: var(--muted); }
.rt-go { margin-left: auto; font: 700 24px/1 var(--body); color: var(--muted); }
.demo-row { display: grid; gap: 8px; justify-items: center; text-align: center; background: var(--tile); border-radius: 16px; padding: 14px 12px; }
.demo-row .chips { justify-content: center; }
.demo-row .pick { background: #fff; }
.linkbtn { background: none; border: 0; padding: 6px 2px; font: 700 15px/1 var(--body); color: var(--fg); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.truckpick { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; border-radius: 12px; padding: 8px 14px 8px 10px; }
.truckpick[aria-pressed="true"] .tpic * { filter: invert(1); }
.demo-menu #welcomeBtn { border: 0; border-top: 1px solid var(--line); background: none; color: var(--fg); font: 600 14px/1 var(--body); text-align: left; padding: 13px 10px 6px; margin-top: 4px; cursor: pointer; }
.demo-menu #welcomeBtn + #reset { border-top: 0; margin-top: 0; padding-top: 8px; }

function miles(a, b) {
  const R = 3958.8, r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h)) * 1.3;   // x1.3 for road distance vs straight line
}
const driveMin = mi => Math.round(mi * 2.2 + 4);   // rough: loaded dump truck, mixed roads
const plantsNear = (pt = SITE) => PLANTS.map(p => ({ p, mi: miles(pt, p) })).sort((a, b) => a.mi - b.mi);
const plantsByDistance = () => plantsNear(SITE);

/* Each map is drawn from GPS coordinates first; a real street map (Leaflet + Esri tiles) fades in over it once tiles load. */
const PIN = "M0 0C-5 -7 -8 -10.5 -8 -15A8 8 0 1 1 8 -15C8 -10.5 5 -7 0 0Z";
function jobMap(j, opts = {}) {
  if (!j.pts) return "";
  const A = siteP(j), Bp = destP(j), W = 340, H = opts.h || 200;
  const k = Math.cos((A.lat + Bp.lat) / 2 * Math.PI / 180);   // longitude shrinks with latitude
  const cx = (A.lng + Bp.lng) / 2 * k, cy = (A.lat + Bp.lat) / 2;

/* ================= Booking engine (shared by every side of the app) ================= */
// Add a truck to a job. Requests from the contractor fill up, and reopen when someone drops out.
function addAssignment(j, a) {
  j.assignments.push(a);
  if (j.req) {
    if (a.sample && ui.role === "contractor") toast(`${a.driver} accepted (${tname(a.type)}). ${filled(j)} of ${needed(j)} booked.`);
    if (j.dayN === 0 && j.req.live && (a.sample || a.fleet)) startDriving(j, a);   // same day: they head straight over
    reqCheck(j);
  }
  softRender();
}
function removeAssignment(j, a) {
  j.assignments = j.assignments.filter(x => x !== a);
  if (j.req) reqCheck(j);
}
function reqCheck(j) {
  const r = j.req; if (!r) return;
  if (r.status === "searching" && filled(j) >= needed(j)) {
    r.status = "booked";
    if (ui.role === "contractor") toast(j.dayN === 0 ? "All trucks found. They're on the way." : "All trucks booked. Every driver confirms the night before.");
    if (ui.offer && ui.offer.jid === j.id) { ui.offer = null; renderOverlay(); }
  } else if (r.status === "booked" && filled(j) < needed(j)) { r.status = "searching"; runSearch(j, 4500); }
}
// Sample drivers accept one by one. The last spots (up to 2) stay open for 25 seconds,
// so you can take one from the Driver, Truck owner or Broker side of the demo.
function runSearch(j, first = 1800) {
  const r = j.req; if (r.timer) return;
  const step = () => {
    r.timer = null;
    if (!S.jobs.includes(j) || r.status !== "searching") return;
    const open = ON().concat(Object.keys(j.needs)).filter((t, i, l) => l.indexOf(t) === i && openFor(j, t) > 0);
    if (!open.length) return;
    const reserve = Math.min(2, needed(j) - 1);
    if (Date.now() - r.t0 < 25000 && needed(j) - filled(j) <= reserve) { r.timer = setTimeout(step, 2000); return; }
    const t = open[Math.floor(Math.random() * open.length)];
    const d = DRIVERS.find(x => x.type === t && !suspended(x.name) && !(r.dropped || []).includes(x.id) && !j.assignments.some(a => a.did === x.id)) || extraDriver(t);
    addAssignment(j, sampleAsg(d));

}

Object.assign(ACTS, {
  "rq-new": () => { ui.req = newReq(); ui.view = null; window.scrollTo(0, 0); },
  "rq-cancel": () => { ui.req = null; },
  "rq-pick": i => { const d = ui.req; d.place = PLACES[+i]; d.plant = bestPlant(d.place, d.kind); d.step = "opt"; window.scrollTo(0, 0); },
  "rq-g": i => { const d = ui.req, p = d.gs && d.gs[+i]; if (!p) return false;
    const place = p.toPlace();
    place.fetchFields({ fields: ["location", "addressComponents", "formattedAddress"] })
      .then(() => useGooglePlace(d, place, p.mainText ? p.mainText.text : p.text.text, p.secondaryText ? p.secondaryText.text.replace(/, USA$/, "") : ""))
      .catch(() => toast("Couldn't look up that address. Try again."));
    return false; },
  "rq-addr": () => { const d = ui.req, q = d.q.trim(); if (!q) return false;
    // Typed address that wasn't in the list: find it with Google's text search, near the yard
    if (G.ok && !G.noPlaces && capOk("places")) {
      google.maps.importLibrary("places").then(({ Place }) => Place.searchByText({ textQuery: q, fields: ["location", "addressComponents", "formattedAddress"], locationBias: { lat: SITE.lat, lng: SITE.lng }, maxResultCount: 1 }))
        .then(({ places }) => { if (places && places[0]) useGooglePlace(d, places[0], q.split(",")[0], ""); else toast("Google couldn't find that address. Check it and try again."); })
        .catch(e => { if (denied(e)) { G.noPlaces = true; act("rq-addr"); } else toast("Couldn't look up that address. Try again."); });   // Places off: use the typed address as before
      return false;
    }
    d.place = { name: q.split(",")[0], sub: q.includes(",") ? q.split(",").slice(1).join(",").trim() : "Near " + (ui.from || "Oakland") + ", CA", lat: SITE.lat + 0.008, lng: SITE.lng + 0.008 };   // until the real app geocodes the address

  "rq-back": () => { ui.req.step = "where"; },
  "rq-kind": i => { const d = ui.req; d.kind = +i; if (!asphaltJob(d.kind)) d.plantN = 0; if (asphaltJob(d.kind) && plant(d.plant).recycle) d.plant = bestPlant(d.place, d.kind); },
  "rq-inc": t => { const d = ui.req; d.counts[t] = Math.min(25, (d.counts[t] || 0) + 1); },
  "rq-dec": t => { const d = ui.req; d.counts[t] = Math.max(0, (d.counts[t] || 0) - 1); d.plantN = Math.min(d.plantN, reqTotal()); },
  "rq-more": () => { ui.req.more = true; },
  "rq-radius": r => { ui.req.radius = +r; },
  "rq-pl+": () => { ui.req.plantN = Math.min(reqTotal(), ui.req.plantN + 1); },
  "rq-pl-": () => { ui.req.plantN = Math.max(0, ui.req.plantN - 1); },
  "rq-day": n => { ui.req.day = +n; },
  "rq-send": () => { if (!reqTotal()) return false; sendRequest(); window.scrollTo(0, 0); },
  "rq-widen": id => { const j = job(id), r = j.req, w = RADII.find(x => x > r.radius); if (!w) return;
    const before = r.sentTo; r.radius = w; r.sentTo = Object.keys(j.needs).reduce((s, t) => s + nearby(t, w), 0);
    toast(`Now sent to ${r.sentTo - before} more drivers, up to ${w} miles away.`); runSearch(j, 1500); },
  "rq-cancel-job": id => { const j = job(id); clearTimeout(j.req.timer); S.jobs = S.jobs.filter(x => x !== j); ui.view = null; toast("Request cancelled. Drivers were told."); },
  "rq-drop": id => { const j = job(id), a = j.assignments.find(x => x.sample) || j.assignments.find(x => x.fleet); if (!a) { toast("Every driver on this job is from the demo sides. Cancel from the Driver side."); return false; }
    (j.req.dropped ||= []).push(a.did); removeAssignment(j, a);
    toast(`${a.driver} cancelled. The spot reopened and went to ${j.req.sentTo} drivers.`); },
  "rq-morning": id => { const j = job(id); j.dayN = 0; j.date = "Today"; j.req.live = true; j.req.liveT0 = Date.now();
    j.assignments.forEach(a => { if (a.sample || a.fleet) startDriving(j, a); });
    toast("It's the morning of the job. Your trucks are on the way."); },
  "rq-end": id => { const j = job(id);
    j.assignments.forEach(a => { if (a.status === "done") return;
      a.otw = null; a.status = "done"; a.checkIn ||= j.start; a.hours = Math.max(1, j.hours + ((hash(a.truck) % 5) - 2) * 0.5); a.out = addMin(a.checkIn, a.hours * 60); delete S.gpsPaused[a.truck]; });
    j.req.ended = true; logGps(`${j.name}: job ended. Every truck clocked out, GPS off.`); toast("Job ended. Check the hours, rate your drivers and approve."); },
  "rq-star": (id, n) => { job(id).stars = +n; },

  "live-job": id => { ui.liveJob = id; },
  "install": () => { if (installEvt) { const ev = installEvt; installEvt = null; ev.prompt(); ev.userChoice.then(() => render()); } return false; },
  "install-hide": () => { installHidden = true; },
  "share": id => { const link = "trucks2u.com/track/" + id.toLowerCase();

});

    const kinds = d.kinds.map(k => String(k).trim());

  if (t) { ui.tab = t.dataset.tab; ui.view = null; ui.req = null; ui.signup = null; ui.bpick = []; render(); window.scrollTo(0, 0); return; }
  const g = e.target.closest("[data-go]");
  if (g) { ui.view = g.dataset.go === "back" ? null : g.dataset.go; ui.dspEdit = null; ui.bpick = []; render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest("[data-act]");
  if (a && !a.disabled) { const [n, x, y, z] = a.dataset.act.split(":"); const pk = a.dataset.pick ? document.getElementById(a.dataset.pick).value : null; act(n, x, y, z, pk); }
});
// Phone fields format themselves as (510) 555-0142 while you type.
function fmtPhone(v) {
  const d = v.replace(/\D/g, "").replace(/^1/, "").slice(0, 10);   // US numbers; a leading 1 is dropped
  if (d.length <= 3) return d;
  if (d.length <= 6) return `(${d.slice(0, 3)}) ${d.slice(3)}`;
  return `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`;
}
document.addEventListener("input", e => {
  const el = e.target; if (!el.hasAttribute || !el.hasAttribute("data-phone")) return;
  const digitsBefore = el.value.slice(0, el.selectionStart).replace(/\D/g, "").replace(/^1/, "").length;
  el.value = fmtPhone(el.value);
  let pos = 0, seen = 0;   // put the cursor back after the same digit
  while (pos < el.value.length && seen < digitsBefore) { if (/\d/.test(el.value[pos])) seen++; pos++; }
  el.setSelectionRange(pos, pos);
}, true);
// Sign-up fields: keep what's typed and switch the Continue button on as soon as the step is complete
function suField(el) {
  const s = ui.signup; if (!s || !el.dataset) return false;
  if (el.dataset.f) s.f[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value;
  else if (el.dataset.det) { const [k, x] = el.dataset.det.split("."); (s.det[k] ||= {})[x] = el.value; }
  else return false;
  const b = $("[data-act=su-next], [data-act=su-submit]"); if (b) b.disabled = !suValid();
  return true;
}
// Contractor sign-up and log-in fields: same idea as the driver sign-up
function newUserField(el) {
  if (!el.dataset) return false;
  if (el.dataset.cf && ui.csu) {
    ui.csu.f[el.dataset.cf] = el.type === "checkbox" ? el.checked : el.value;
    const b = $("#csu-go"); if (b) b.disabled = !csuValid();
    return true;
  }
  if (el.dataset.bf && ui.bsu) {
    ui.bsu.f[el.dataset.bf] = el.type === "checkbox" ? el.checked : el.value;
    const b = $("#bsu-go"); if (b) b.disabled = !bsuValid();
    return true;
  }
  if (el.dataset.df && ui.dsu) {
    ui.dsu.f[el.dataset.df] = el.type === "checkbox" ? el.checked : el.value;
    const b = $("#dsu-go"); if (b) b.disabled = !dsuValid();
    return true;
  }
  if (el.dataset.iv && ui.inv) { ui.inv[el.dataset.iv] = el.value; return true; }
  if (el.dataset.lg && ui.login) {
    ui.login[el.dataset.lg] = el.value;
    const b = $("#lg-go"), n = el.value.replace(/\D/g, "").length;
    if (b) b.disabled = el.dataset.lg === "phone" ? n !== 10 : n !== 6;
    return true;
  }
  return false;
}
document.addEventListener("input", e => {
  const el = e.target;
  if (newUserField(el)) return;
  if (suField(el)) return;
  if (setDraftFrom(el)) return;
  if (el.id === "rq-q" && ui.req) { ui.req.q = el.value; $("#rq-results").innerHTML = placeList(el.value.trim()); gSuggest(el.value.trim()); }
  if (el.id === "rq-note" && ui.req) ui.req.note = el.value;
});
document.addEventListener("change", e => {
  const el = e.target;
  if (newUserField(el)) return;
  if (suField(el)) { if (el.dataset.det && el.dataset.det.endsWith(".exp")) render(); return; }   // re-draw to show expiry warnings
  if (setDraftFrom(el)) { if (el.type === "checkbox" || el.tagName === "SELECT") render(); return; }
  const dk = el.dataset && el.dataset.dfile;
  if (dk && ui.dsu && el.files[0]) {
    const file = el.files[0], d = ui.dsu, done = url => { d.files[dk] = { name: file.name, url }; d.det[dk] = { ...SCAN()[dk] }; render(); };
    if (file.type.startsWith("image/")) { const r = new FileReader(); r.onload = () => done(r.result); r.readAsDataURL(file); } else done(null);
    return;
  }
  const fk = el.dataset && el.dataset.file;
  if (fk && ui.signup && el.files[0]) {
    const file = el.files[0], su = ui.signup, done = url => { su.files[fk] = { name: file.name, url }; if (SCAN()[fk] && !su.det[fk]) su.det[fk] = { ...SCAN()[fk] }; render(); };
    if (file.type.startsWith("image/")) { const r = new FileReader(); r.onload = () => done(r.result); r.readAsDataURL(file); } else done(null);
    return;
  }
  if (el.dataset && el.dataset.mydoc && el.files[0]) { S.myDocs[+el.dataset.mydoc] = [S.myDocs[+el.dataset.mydoc][0], "New one sent for review", "good"]; toast("Got it. We'll check it within a day."); render(); return; }
  if (el.dataset && el.dataset.bpick) { const id = el.dataset.bpick; ui.bpick = el.checked ? [...(ui.bpick || []), id] : (ui.bpick || []).filter(x => x !== id); render(); return; }
  if (ui.req && el.id === "rq-plant") { ui.req.plant = el.value; render(); }
  if (ui.req && el.id === "rq-time") { ui.req.time = el.value; }
  if (ui.req && el.id === "rq-hours") { ui.req.hours = +el.value; render(); }
  if (el.id === "pl-q") { ui.plq = el.value; render(); }
  if (el.id === "pl-from") { ui.from = el.value; SITE = FROM[ui.from]; render(); }
});
$("#reset").addEventListener("click", () => {
  $("#demo").removeAttribute("open");
  Object.keys(gpsStage).forEach(k => delete gpsStage[k]);
  S.jobs.forEach(j => j.req && clearTimeout(j.req.timer));
  S = seed(); MY_TRUCKS.forEach((t, i) => t.type = MY_TRUCKS_SEED[i]); SITE = FROM.Oakland;
  ME_CONTRACTOR = DEFAULT_CONTRACTOR; ME_CONTACT = { ...DEFAULT_CONTACT }; MY_DRIVERS.length = MY_DRIVERS_N;
  ui = freshUi(ui.role); render(); window.scrollTo(0, 0);

});

/* ---------- Phone or Computer layout; remembered in this browser. On a real phone it's always Phone. ---------- */
const small = matchMedia("(max-width: 600px)");
function savedLayout() { try { return localStorage.getItem("t2u-layout") || "phone"; } catch (e) { return "phone"; } }
function applyLayout() {
  const l = small.matches ? "phone" : savedLayout();
  document.documentElement.dataset.layout = l;
  document.querySelectorAll("[data-lay]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lay === l));
}
function setLayout(l) { try { localStorage.setItem("t2u-layout", l); } catch (e) {} applyLayout(); render(); }
const relayout = () => { if (document.documentElement.dataset.layout !== (small.matches ? "phone" : savedLayout())) { applyLayout(); render(); } };
small.addEventListener("change", relayout); addEventListener("resize", relayout);   // resize too: some browsers skip the media "change" event
applyLayout();

// Direct links open a side of the app: #contractor #owner #driver #broker (or #fleet) #admin, and #signup
function openFromHash() {
  const h = location.hash.slice(1).toLowerCase(), roles = { contractor: "contractor", owner: "owner", driver: "driver", broker: "broker", fleet: "broker", admin: "admin" };
  if (h === "signup") { ui = freshUi("driver"); ui.signup = newSignup(); }
  else if (h === "welcome" || (!h && !seenWelcome())) { ui = freshUi("contractor"); ui.welcome = true; }
  else if (h === "invite") { markSeen(); const inv = { id: "I-demo", name: "Sam Ortiz", phone: "(510) 555-0166", owner: ME_OWNER, status: "sent" }; if (!invites().some(x => x.id === inv.id)) invites().unshift(inv); ui = freshUi("driver"); ui.dsu = newDsu(inv); }
  else if (roles[h]) ui = freshUi(roles[h]);
  render();
}
addEventListener("hashchange", () => { openFromHash(); window.scrollTo(0, 0); });
openFromHash();
setInterval(tickMap, 250);
