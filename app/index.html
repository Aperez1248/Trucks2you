<meta charset="utf-8">
<title>Trucks2U</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a phone-shaped app; full-bleed map underneath, a white bottom sheet on top, like a ride-hailing app. */
:root {
  --bg: #e9ebee;
  --sheet: #ffffff;
  --fg: #000000;
  --muted: #5e5e5e;
  --line: #e2e2e2;
  --chip: #f3f3f3;
  --btn: #000000;
  --btn-fg: #ffffff;
  --go: #06c167;
  --route: #276ef1;
  --warn: #c76a00;
  --land: #eef0f3;
  --park: #dcefe0;
  --water: #c9def2;
  --road: #ffffff;
  --road-edge: #d6dae0;
  --hwy: #f6d98f;
  --hwy-edge: #e3c06a;
  --label: #8a9099;
  --font: "Figtree", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0b; --sheet: #161616; --fg: #ffffff; --muted: #a6a6a6; --line: #2c2c2c; --chip: #262626;
    --btn: #ffffff; --btn-fg: #000000; --go: #1fd47f; --route: #5b93ff; --warn: #f0a640;
    --land: #1e2126; --park: #1f2b23; --water: #142233; --road: #33373e; --road-edge: #2a2d33; --hwy: #6b5a2c; --hwy-edge: #59491f; --label: #7c828b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0b; --sheet: #161616; --fg: #ffffff; --muted: #a6a6a6; --line: #2c2c2c; --chip: #262626;
  --btn: #ffffff; --btn-fg: #000000; --go: #1fd47f; --route: #5b93ff; --warn: #f0a640;
  --land: #1e2126; --park: #1f2b23; --water: #142233; --road: #33373e; --road-edge: #2a2d33; --hwy: #6b5a2c; --hwy-edge: #59491f; --label: #7c828b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.4 var(--font); }
.wrap { max-width: 440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 20px; display: grid; gap: 10px; }
.switch { display: grid; grid-template-columns: 1fr 1fr; background: var(--sheet); border-radius: 999px; padding: 4px; border: 1px solid var(--line); }
.switch button { border: 0; background: none; color: var(--muted); font: 600 14px/1 var(--font); padding: 11px 8px; border-radius: 999px; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); }
.phone { position: relative; height: 760px; max-height: calc(100vh - 110px); min-height: 600px; border-radius: 28px; overflow: hidden; background: var(--land); border: 1px solid var(--line); }
.map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.top { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 3; pointer-events: none; }
.top > * { pointer-events: auto; }
.round { width: 44px; height: 44px; border-radius: 50%; background: var(--sheet); color: var(--fg); border: 0; display: grid; place-items: center; box-shadow: 0 2px 10px rgb(0 0 0 / .18); cursor: pointer; font: 700 15px var(--font); }
.pill { background: var(--sheet); color: var(--fg); border-radius: 999px; padding: 10px 16px; font-weight: 700; box-shadow: 0 2px 10px rgb(0 0 0 / .18); font-variant-numeric: tabular-nums; }
.brand { font: 800 19px/1 var(--font); letter-spacing: -.3px; background: var(--sheet); padding: 11px 16px; border-radius: 999px; box-shadow: 0 2px 10px rgb(0 0 0 / .18); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--sheet); border-radius: 20px 20px 0 0; box-shadow: 0 -4px 24px rgb(0 0 0 / .14); padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; max-height: 78%; overflow-y: auto; }
.sheet::before { content: ""; width: 38px; height: 5px; border-radius: 9px; background: var(--line); justify-self: center; }
.full { position: absolute; inset: 0; z-index: 6; background: var(--sheet); padding: 18px; display: grid; gap: 14px; align-content: start; grid-auto-rows: max-content; overflow-y: auto; }
h1 { font: 800 26px/1.15 var(--font); margin: 0; letter-spacing: -.4px; text-wrap: balance; }
h2 { font: 700 20px/1.2 var(--font); margin: 0; letter-spacing: -.2px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.row > * { min-width: 0; }
.stack { display: grid; gap: 8px; }
.btn { border: 0; background: var(--btn); color: var(--btn-fg); font: 700 17px/1 var(--font); padding: 17px; border-radius: 10px; width: 100%; cursor: pointer; }
.btn.light { background: var(--chip); color: var(--fg); }
.btn.go { background: var(--go); color: #fff; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.search { display: flex; align-items: center; gap: 12px; background: var(--chip); border: 0; border-radius: 10px; padding: 15px 16px; font: 700 18px var(--font); color: var(--fg); width: 100%; cursor: pointer; text-align: left; }
.search i { width: 10px; height: 10px; background: var(--fg); flex: none; }
.place { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; color: var(--fg); font: inherit; }
.place .ic { width: 38px; height: 38px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; flex: none; font-size: 16px; }
.place b { display: block; font-weight: 600; }
.place span { font-size: 14px; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; flex: none; }
.full > .chips { min-height: 40px; flex-shrink: 0; overflow-y: hidden; }
.chip { border: 0; background: var(--chip); color: var(--fg); font: 600 14px var(--font); padding: 10px 14px; border-radius: 999px; white-space: nowrap; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); }
.opt { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border: 2px solid transparent; border-radius: 12px; cursor: pointer; }
.opt.on { border-color: var(--fg); }
.opt .name { font-weight: 700; font-size: 17px; }
.opt .meta { font-size: 13px; color: var(--muted); }
.opt .price { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.step { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-top: 4px; }
.step button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--chip); color: var(--fg); font: 700 18px/1 var(--font); cursor: pointer; }
.step output { width: 20px; text-align: center; font-weight: 800; }
.driver { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-weight: 800; }
.tag { font: 700 12px/1 var(--font); padding: 6px 9px; border-radius: 6px; background: var(--chip); white-space: nowrap; }
.tag.go { background: var(--go); color: #fff; }
.bar { height: 4px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fg); transition: width .4s; }
.gobtn { position: absolute; left: 50%; transform: translateX(-50%); bottom: 150px; z-index: 5; width: 84px; height: 84px; border-radius: 50%; border: 5px solid var(--sheet); background: var(--route); color: #fff; font: 800 24px var(--font); cursor: pointer; box-shadow: 0 4px 18px rgb(0 0 0 / .3); }
.gobtn.stop { background: #e11900; font-size: 15px; }
.offer { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 7; background: #000; color: #fff; border-radius: 18px; padding: 18px; display: grid; gap: 14px; box-shadow: 0 10px 40px rgb(0 0 0 / .45); }
.offer .muted { color: #b3b3b3; }
.offer .btn { background: var(--route); color: #fff; }
.offer .btn.light { background: #2b2b2b; color: #fff; }
.ring { width: 56px; height: 56px; flex: none; }
.big { font: 800 34px/1 var(--font); letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.kv { display: grid; gap: 10px; }
.kv .row span:first-child { color: var(--muted); }
.kv .row span:last-child { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.stars button { background: none; border: 0; font-size: 30px; color: var(--line); cursor: pointer; padding: 0 2px; }
.stars button.on { color: var(--fg); }
label.f { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
input, select { width: 100%; font: 500 16px var(--font); color: var(--fg); background: var(--chip); border: 2px solid transparent; border-radius: 10px; padding: 13px 14px; }
input:focus, select:focus { border-color: var(--fg); outline: none; }
.doc { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.doc input[type=file] { display: none; }
.doc label { background: var(--chip); padding: 9px 14px; border-radius: 999px; font: 700 14px var(--font); cursor: pointer; }
.doc .ok { color: var(--go); font-weight: 700; font-size: 14px; }
.menu { position: absolute; inset: 0; z-index: 8; background: rgb(0 0 0 / .4); }
.menu > div { background: var(--sheet); width: 78%; height: 100%; padding: 22px 18px; display: grid; gap: 4px; align-content: start; }
.menu .place { border-bottom: 0; }
.toast { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); z-index: 9; background: var(--btn); color: var(--btn-fg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; width: max-content; max-width: calc(100% - 32px); text-align: center; }
.welcome { position: absolute; inset: 0; z-index: 6; background: #000; color: #fff; padding: 28px 20px; display: grid; gap: 12px; align-content: end; }
.welcome .logo { font: 800 30px/1 var(--font); letter-spacing: -.6px; position: absolute; top: 28px; left: 20px; }
.welcome h1 { font-size: 34px; letter-spacing: -.8px; margin-bottom: 8px; }
.role { display: grid; grid-template-columns: 46px 1fr 16px; gap: 14px; align-items: center; background: #1c1c1c; border: 0; color: #fff; border-radius: 14px; padding: 16px; text-align: left; font: inherit; cursor: pointer; }
.role:hover { background: #2a2a2a; }
.role .ic { width: 46px; height: 46px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; font-size: 22px; }
.role b { display: block; font-size: 18px; }
.role span { color: #b3b3b3; font-size: 14px; }
.check { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--fg); padding: 0; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
button:focus-visible, .opt:focus-visible, label:focus-within { outline: 3px solid var(--route); outline-offset: 2px; }
@keyframes pulse { from { r: 20; opacity: .55; } to { r: 140; opacity: 0; } }
.pulse { fill: var(--fg); animation: pulse 1.8s ease-out infinite; }
.pulse.b { animation-delay: .9s; }
/* ---------- Website layout on computers: full-screen map, panel on the left ---------- */
.site { display: none; }
@media (min-width: 960px) {
  .wrap { max-width: none; padding: 0; gap: 0; }
  .foot { display: none; }
  .phone { height: 100vh; max-height: none; min-height: 560px; border-radius: 0; border: 0; }
  .site { display: flex; position: absolute; top: 0; left: 0; right: 0; height: 64px; z-index: 10; background: #000; color: #fff; align-items: center; gap: 28px; padding: 0 28px; }
  .site b { font: 800 22px/1 var(--font); letter-spacing: -.4px; }
  .site .who { color: #b3b3b3; font-weight: 600; }
  .site button { margin-left: auto; background: #fff; color: #000; border: 0; border-radius: 999px; padding: 10px 18px; font: 700 14px var(--font); cursor: pointer; }
  .site button[hidden] { display: none; }
  .top { top: 82px; left: 24px; right: auto; width: 440px; }
  .sheet { top: 142px; left: 24px; right: auto; bottom: auto; width: 440px; max-height: calc(100% - 166px); border-radius: 16px; align-content: start; padding: 20px 22px; box-shadow: 0 6px 30px rgb(0 0 0 / .18); }
  .sheet::before { display: none; }
  .full { top: 64px; padding: 36px max(24px, calc(50% - 380px)) 48px; }
  .gobtn { left: calc(50% + 232px); bottom: 56px; }
  .offer { left: calc(50% + 232px); right: auto; bottom: 40px; width: 460px; transform: translateX(-50%); }
  .menu { top: 64px; }
  .menu > div { width: 380px; }
  .toast { top: 82px; left: calc(50% + 232px); }
  .welcome { top: 64px; align-content: center; padding: 40px max(24px, calc(50% - 280px)); }
  .welcome .logo { display: none; }
  .welcome h1 { font-size: 52px; }
}
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: .12; } .bar i { transition: none; } }
</style>

<div class="wrap">
  <div class="phone" id="phone">
    <header class="site"><b>Trucks2U</b><span class="who" id="who"></span><button data-mode="welcome" id="site-switch" hidden>Switch account</button></header>
    <svg class="map" id="map" viewBox="0 0 400 760" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <div id="ui"></div>
  </div>
  <p class="foot">Prototype with sample drivers and addresses. To see another side of the same job, open the menu (☰) and tap Switch account.</p>
</div>

<script>
/* ---------- Data ---------- */
const TRUCKS = {
  w10: { name: "10 wheeler", short: "10W", seat: "~15 tons a load", rate: 115 },
  w12: { name: "12 wheeler", short: "12W", seat: "~19 tons a load", rate: 130 },
  sd:  { name: "Super dumper", short: "SD", seat: "~26 tons a load", rate: 150 },
  bd:  { name: "Bottom dump", short: "BD", seat: "~25 tons a load", rate: 140 },
  sdd: { name: "Side dump", short: "SDT", seat: "~25 tons a load", rate: 145 },
  tr:  { name: "Transfer", short: "TR", seat: "~27 tons a load", rate: 145 },
  wt:  { name: "Water truck", short: "WT", seat: "2,000 to 4,000 gallons", rate: 125 },
  fb:  { name: "Flatbed", short: "FB", seat: "Materials and equipment", rate: 120 },
  lb:  { name: "Lowboy", short: "LB", seat: "Moves rollers and pavers", rate: 165 }
};
const MAIN = ["w10", "w12", "sd"];   // shown first; the rest sit under "More truck types"
let MIN_HRS = 6;                       // drivers are paid by the hour, 6-hour minimum (admin > Settings)
const RADII = [10, 25, 50, 75, 100];   // miles
// Most jobs are booked for tomorrow or a few days out
const DAY0 = new Date();
const dateOf = n => { const d = new Date(DAY0); d.setDate(d.getDate() + n); return d; };
const dayLabel = n => dateOf(n).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const chipDay = n => n === 1 ? "Tomorrow" : dateOf(n).toLocaleDateString("en-US", { weekday: "short", day: "numeric" });
const PLANTS = [
  { name: "DeSilva Gates asphalt plant", sub: "Dublin, CA", x: 340, y: 600 },
  { name: "Argent Materials", sub: "Oakland, CA", x: 150, y: 170 },
  { name: "Antioch Building Materials", sub: "Antioch, CA", x: 370, y: 120 }
];
// Work-day clock for the demo: 1 real second = 4 minutes on the job
const toMin = t => { const [h, m] = t.split(/[: ]/); return (+h % 12) * 60 + +m + (/PM/.test(t) ? 720 : 0); };
const fmtMin = v => { v = Math.round(v) % 1440; const h = Math.floor(v / 60), m = v % 60; return `${(h % 12) || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };
const dayMin = () => job.dayMin + (Date.now() - job.dayT0) / 1000 * 4;
const startOf = m => job.crew.indexOf(m) < (job.plantN || 0) ? "plant" : "site";
const startPt = m => startOf(m) === "plant" ? PLANTS[job.plant] : job.place;
const TIMES = ["5:00 AM", "5:30 AM", "6:00 AM", "6:30 AM", "7:00 AM", "8:00 AM", "6:00 PM", "7:00 PM", "8:00 PM"];
let FEE = 0.07;          // taken from the driver's pay, like a broker (brokers take 10 to 12%)
let BROKER_PCT = 0.11;   // what a typical broker keeps, shown to contractors for comparison
let FLEET_FEE = 15;      // placeholder: $ per truck per day when a fleet dispatches its own trucks
let PAYDAY = "Friday";   // weekly payout day
const MATERIALS = ["Haul off grindings", "Bring asphalt", "Both"];
const PLACES = [
  { name: "Main St & Oak Ave", sub: "Oakland, CA", x: 205, y: 300 },
  { name: "Lakeside Plaza parking lot", sub: "300 Shore Rd, San Leandro", x: 140, y: 420 },
  { name: "Harbor Blvd & 2nd St", sub: "Richmond, CA", x: 95, y: 215 },
  { name: "Mission Blvd resurfacing", sub: "Hayward, CA", x: 285, y: 470 },
  { name: "Elm St school lot", sub: "Fremont, CA", x: 300, y: 600 }
];
const NAMES = ["Marco R.", "Luis O.", "Dana K.", "Tam N.", "Ben C.", "Ana R.", "Raj P.", "Mike H.", "Joe S.", "Carlos M.", "Steve B.", "Rosa G.", "Dev P.", "Frank T.", "Lena W.", "Omar A.", "Jim W.", "Tony V.", "Kim L.", "Sal D."];
let TYPES = Object.keys(TRUCKS);

/* ---------- Business settings (admin > Settings) ---------- */
// The app has no server yet, so settings are saved in this browser only.
const SET_KEY = "trucks2u-settings-v1";
const clone = o => JSON.parse(JSON.stringify(o));
const pct = n => +(n * 100).toFixed(2) + "%";
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const currentSettings = () => clone({ trucks: TRUCKS, main: MAIN, fee: FEE, minHrs: MIN_HRS, brokerPct: BROKER_PCT, fleetFee: FLEET_FEE, payday: PAYDAY, materials: MATERIALS, times: TIMES, radii: RADII });
const DEFAULTS = currentSettings();
function applySettings(st) {
  st = { ...clone(DEFAULTS), ...clone(st) };
  // A removed truck type is kept but switched off, so old jobs and sample data still show its name
  Object.keys(DEFAULTS.trucks).forEach(k => { if (!st.trucks[k]) st.trucks[k] = { ...DEFAULTS.trucks[k], off: true }; });
  Object.keys(TRUCKS).forEach(k => delete TRUCKS[k]); Object.assign(TRUCKS, st.trucks);
  MAIN.splice(0, MAIN.length, ...st.main.filter(k => TRUCKS[k]));
  FEE = st.fee; MIN_HRS = st.minHrs; BROKER_PCT = st.brokerPct; FLEET_FEE = st.fleetFee; PAYDAY = st.payday;
  MATERIALS.splice(0, MATERIALS.length, ...st.materials);
  TIMES.splice(0, TIMES.length, ...st.times);
  RADII.splice(0, RADII.length, ...st.radii);
  TYPES = Object.keys(TRUCKS).filter(t => !TRUCKS[t].off);
}
function saveSettings(st) { applySettings(st); try { localStorage.setItem(SET_KEY, JSON.stringify(currentSettings())); return true; } catch (e) { return false; } }
try { const saved = JSON.parse(localStorage.getItem(SET_KEY) || "null"); if (saved && saved.trucks) applySettings(saved); } catch (e) {}
// After settings change, move any choice that no longer exists to one that does
function syncState() {
  const near = (v, list) => list.includes(v) ? v : list.reduce((b, x) => Math.abs(x - v) < Math.abs(b - v) ? x : b, list[0]);
  Object.keys(TRUCKS).forEach(t => { if (C.counts[t] == null || TRUCKS[t].off) C.counts[t] = 0; });
  if (!TYPES.includes(C.focus)) C.focus = TYPES[0];
  if (!MATERIALS.includes(C.material)) C.material = MATERIALS[0];
  if (!TIMES.includes(C.time)) C.time = TIMES.includes("6:00 AM") ? "6:00 AM" : TIMES[0];
  C.radius = near(C.radius, RADII); D.radius = near(D.radius, RADII);
  C.hours = Math.max(C.hours, MIN_HRS);
}
// Sample drivers spread around the map (positions in map units)
const DRIVERS = NAMES.map((n, i) => ({
  id: "d" + i, name: n, type: ["w10", "w12", "sd", "w12", "bd", "w10", "tr", "w12", "sd", "wt", "w10", "w12", "lb", "sd", "w12", "sdd", "w10", "fb", "w12", "sd"][i], rating: (4.7 + ((i * 7) % 3) / 10).toFixed(1),
  plate: ["8", "7", "6"][i % 3] + "ABC" + (100 + i * 37) % 900,
  x: 40 + ((i * 97) % 320), y: 120 + ((i * 151) % 520), phone: "(510) 555-01" + String(10 + i).padStart(2, "0")
}));
// The fleet in the fleet (broker) side of the app
const FLEET = { name: "Summit Hauling", owner: "Rick S.", trucks: [
  { id: "SH-01", driver: "Pete A.", type: "w10", x: 120, y: 520, status: "online" },
  { id: "SH-02", driver: "Gus M.", type: "w12", x: 160, y: 470, status: "online" },
  { id: "SH-03", driver: "Lou F.", type: "w12", x: 250, y: 560, status: "online" },
  { id: "SH-04", driver: "Ray T.", type: "w12", x: 330, y: 640, status: "job" },
  { id: "SH-05", driver: "Nick D.", type: "sd", x: 210, y: 650, status: "online" },
  { id: "SH-06", driver: "Hal B.", type: "sd", x: 290, y: 380, status: "job" },
  { id: "SH-07", driver: "Eddie K.", type: "w10", x: 360, y: 520, status: "offline" },
  { id: "SH-08", driver: "Walt J.", type: "sd", x: 100, y: 640, status: "online" }
] };
const ME = { name: "Marco R.", type: "w12", plate: "8XKD218", rating: "4.9", x: 330, y: 190, city: "Hayward, CA" };   // the driver in the driver app
const DEMO_ME = { ...ME };
// Who is signed in on each side: null = not signed in yet (shows "new or existing?"), "demo" = the sample account, "new" = an account made in this visit
const ACCT = { driver: null, contractor: null, fleet: null };
const NEW = { driver: null, contractor: null, fleet: null };   // accounts made with the sign-up screens

const totalTrucks = () => TYPES.reduce((s, t) => s + C.counts[t], 0);

function toast(msg) {

/* ---------- Map ---------- */

  g.push(`<rect x="-2000" y="-300" width="4400" height="1400" fill="var(--land)"/>`);
  g.push(`<path d="M-170 -300 H70 V0 C60 120 40 180 55 260 C70 340 30 420 20 520 C10 620 30 700 0 760 V1100 H-150 C-190 900 -130 700 -160 500 C-190 300 -140 100 -170 -300 Z" fill="var(--water)"/>`);
  for (let y = -250; y < 1100; y += 58) g.push(`<path d="M-2000 ${y} H-185" stroke="var(--road-edge)" stroke-width="9"/><path d="M-2000 ${y} H-185" stroke="var(--road)" stroke-width="7"/>`);
  for (let x = -230; x > -2000; x -= 64) g.push(`<path d="M${x} -300 V1100" stroke="var(--road-edge)" stroke-width="9"/><path d="M${x} -300 V1100" stroke="var(--road)" stroke-width="7"/>`);
  g.push(`<rect x="420" y="120" width="90" height="70" rx="6" fill="var(--park)"/><rect x="560" y="520" width="120" height="80" rx="6" fill="var(--park)"/>`);
  g.push(`<rect x="230" y="360" width="70" height="55" rx="6" fill="var(--park)"/><rect x="120" y="560" width="90" height="60" rx="6" fill="var(--park)"/>`);
  for (let y = -250; y < 1100; y += 58) g.push(`<path d="M60 ${y} H2400" stroke="var(--road-edge)" stroke-width="9"/><path d="M60 ${y} H2400" stroke="var(--road)" stroke-width="7"/>`);
  for (let x = 90; x < 2400; x += 64) g.push(`<path d="M${x} -300 V1100" stroke="var(--road-edge)" stroke-width="9"/><path d="M${x} -300 V1100" stroke="var(--road)" stroke-width="7"/>`);
  const hwy = "M40 1100 L80 760 C140 560 170 420 260 300 C320 220 360 120 400 60 L620 -300";
  g.push(`<path d="${hwy}" fill="none" stroke="var(--hwy-edge)" stroke-width="15"/><path d="${hwy}" fill="none" stroke="var(--hwy)" stroke-width="11"/>`);
  g.push(`<text x="300" y="230" fill="var(--label)" font-size="11" font-weight="700" transform="rotate(-50 300 230)">I-880</text>`);
  g.push(`<text x="22" y="320" fill="var(--label)" font-size="11" font-weight="600" transform="rotate(-90 22 320)">San Francisco Bay</text>`);

  $("#map").innerHTML = g.join("");
}
function truckIcon(x, y, angle, cls = "") {
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${angle.toFixed(0)})" class="${cls}">
    <rect x="-11" y="-6" width="22" height="12" rx="3" fill="var(--fg)"/><rect x="5" y="-5" width="5" height="10" rx="1.5" fill="var(--sheet)" opacity=".85"/></g>`;
}
function pin(p) {
  return `<g transform="translate(${p.x} ${p.y})"><rect x="-9" y="-9" width="18" height="18" fill="var(--fg)"/><rect x="-3.5" y="-3.5" width="7" height="7" fill="var(--sheet)"/></g>`;
}
// Positions of trucks moving toward the job, by elapsed time
function movePos(start, target, t0, mins) {
  const f = Math.min(1, (Date.now() - t0) / (mins * 1500));   // 1 "minute" = 1.5 s in the demo
  return { x: start.x + (target.x - start.x) * f, y: start.y + (target.y - start.y) * f, f, angle: Math.atan2(target.y - start.y, target.x - start.x) * 180 / Math.PI };
}
function drawMap() {
  const ov = $("#overlay"), cars = $("#cars"); if (!ov) return;
  let o = "", c = "";
  const live = job && job.status !== "done" && job.status !== "cancelled";
  if (mode === "contractor") {
    if (live && job.status === "searching") o += `<circle class="pulse" cx="${job.place.x}" cy="${job.place.y}" r="20"/><circle class="pulse b" cx="${job.place.x}" cy="${job.place.y}" r="20"/>`;
    const p = C.place || (live && job.place);
    if (p) o += pin(p);
    if (live) {
      if (job.plantN) o += plantPin(PLANTS[job.plant]);
      job.crew.forEach(m => { const q = crewPos(m), to = m.leg ? m.leg.to : startPt(m); o += sched() || m.at || (m.arrived && !m.leg) ? "" : `<path d="M${q.x} ${q.y} L${to.x} ${to.y}" stroke="var(--route)" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round" opacity=".8"/>`; c += truckIcon(q.x, q.y, q.angle) + (m.id === "me" ? `<circle cx="${q.x}" cy="${q.y}" r="16" fill="none" stroke="var(--route)" stroke-width="3"/>` : ""); });
      DRIVERS.filter(d => !job.crew.some(m => m.id === d.id)).slice(0, 8).forEach(d => c += truckIcon(d.x, d.y, (d.x * 3) % 360, "idle"));
    } else {
      DRIVERS.forEach(d => c += truckIcon(d.x, d.y, (d.x * 3) % 360));
    }
  } else if (mode === "fleet") {
    if (live && job.status === "searching") o += `<circle class="pulse" cx="${job.place.x}" cy="${job.place.y}" r="20"/>` + pin(job.place);
    FLEET.trucks.forEach(k => {
      const m = live && job.crew.find(x => x.id === k.id);
      if (m) { const q = crewPos(m); if (!m.arrived && !sched()) o += `<path d="M${q.x} ${q.y} L${job.place.x} ${job.place.y}" stroke="var(--route)" stroke-width="3" stroke-linecap="round"/>`; c += truckIcon(q.x, q.y, q.angle); }
      else c += `<g opacity="${k.status === "offline" ? .35 : 1}">${truckIcon(k.x, k.y, (k.x * 3) % 360)}</g>`;
    });
    if (live && job.crew.some(m => m.fleet)) o += pin(job.place);
  } else if (mode === "driver") {
    const mine = live && !sched() && job.crew.find(m => m.id === "me");
    if (mine) {
      const q = crewPos(mine), to = mine.leg ? mine.leg.to : (mine.at ? null : startPt(mine));
      if (job.plantN) o += plantPin(PLANTS[job.plant]);
      o += (to ? `<path d="M${q.x} ${q.y} L${to.x} ${to.y}" stroke="var(--route)" stroke-width="6" stroke-linecap="round"/>` : "") + pin(job.place);
      c += truckIcon(q.x, q.y, q.angle);
    } else {
      if (D.online) o += `<circle class="pulse" cx="${ME.x}" cy="${ME.y}" r="20"/>`;
      if (D.screen === "offer" && job) o += `<path d="M${ME.x} ${ME.y} L${job.place.x} ${job.place.y}" stroke="var(--route)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 9"/>` + pin(job.place);
      c += truckIcon(ME.x, ME.y, 200);
    }
  }
  ov.innerHTML = o; cars.innerHTML = c;
}
function sched() { return job && job.when !== "Now"; }   // a job scheduled for later: trucks are confirmed, not driving yet
function crewPos(m) {
  if (sched()) return { x: m.start.x, y: m.start.y, angle: (m.start.x * 3) % 360 };
  if (m.leg) { const p = movePos(m.leg.from, m.leg.to, m.leg.t0, m.leg.mins); if (p.f >= 1) { m.at = m.leg.to; m.leg = null; } return p; }
  if (m.at) return { x: m.at.x + (m.slot % 4) * 14 - 20, y: m.at.y + 22, angle: 0 };
  const tgt = startPt(m);
  if (m.arrived) return { x: tgt.x + (m.slot % 4) * 14 - 20, y: tgt.y + 22, angle: 0 };
  const p = movePos(m.start, tgt, m.t0, m.eta);
  if (p.f >= 1 && m.id !== "me") { m.arrived = true; m.status = "Arrived"; m.clockIn = m.clockIn || dayMin(); }
  return p;
}
const plantPin = pl => `<g transform="translate(${pl.x} ${pl.y})"><circle r="11" fill="var(--warn)"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="800">P</text></g>`;

function fromDraft(d) {

/* ---------- Job engine ---------- */
function startJob() {
  const wantByType = { ...C.counts };
  if (job && sched() && job.status !== "cancelled") C_JOBS.push({ owner: ACCT.contractor, dayN: job.dayN, start: job.start, hours: job.hours, place: job.place, material: job.material, need: job.need, crew: job.crew });
  job = { place: C.place, material: C.material, when: C.day ? `${dayLabel(C.day)} · ${C.time}` : "Now", dayN: C.day, date: dayLabel(C.day), start: C.time, hours: C.hours, wantByType, need: totalTrucks(), crew: [], status: "searching", radius: C.radius, sentTo: TYPES.reduce((s, t) => s + (C.counts[t] ? nearby(t) : 0), 0), contact: "Al, (510) 555-0100", notes: [], note: C.note.trim(), plantN: Math.min(C.plantN, totalTrucks()), plant: C.plant, updates: [], unread: 0, dayT0: Date.now(), dayMin: C.day ? toMin(C.time) : new Date().getHours() * 60 + new Date().getMinutes() };
  // Other drivers accept one by one; leave a 12-wheeler spot for "me" if one was requested and I'm online soon
  const queue = [];
  TYPES.forEach(t => { const pool = DRIVERS.filter(d => d.type === t).sort((a, b) => dist(a, job.place) - dist(b, job.place)); for (let i = 0; i < wantByType[t]; i++) queue.push(pool[i % pool.length]); });
  // Sample drivers accept one by one, but leave the last spots open for 25 seconds so you can
  // take one from the driver or fleet side of the demo.
  const reserve = job.need > 2 ? 2 : job.need - 1, t0 = Date.now();
  let i = 0;
  const next = () => {
    if (!job || job.status !== "searching" || i >= queue.length) return;
    if (job.crew.length >= job.need - reserve && Date.now() - t0 < 25000) { setTimeout(next, 2000); return; }
    const d = queue[i++];
    if (job.crew.filter(m => m.type === d.type).length < job.wantByType[d.type]) addCrew(d);
    setTimeout(next, 1600 + Math.random() * 1400);
  };
  setTimeout(next, 1800);
}
function addCrew(d) {
  if (!job || job.crew.filter(m => m.type === d.type).length >= job.wantByType[d.type]) return;
  job.crew.push({ id: d.id, name: d.name, type: d.type, rating: d.rating, plate: d.plate, phone: d.phone, start: { x: d.x, y: d.y }, t0: Date.now(), eta: etaMin(d, job.place), status: "On the way", slot: job.crew.length, arrived: false, reconfirmed: Math.random() < .6 });
  if (mode === "contractor") toast(`${d.name} accepted · ${TRUCKS[d.type].name}`);
  checkFilled();
}
function checkFilled() {
  if (job && job.crew.length >= job.need && job.status === "searching") { job.status = "live"; if (mode === "contractor") { C.screen = "live"; toast(sched() ? "All trucks booked. We'll remind the drivers." : "All trucks found. They're on the way."); } if (D.screen === "offer") { closeOffer(); toast("That job just filled."); } }
  render();
}
function maybeOffer() {
  if (!sched() && mode === "driver" && D.online && D.screen === "home" && myOpenSlot()) {
    D.screen = "offer"; D.offerLeft = 20;
    clearInterval(offerTimer);
    offerTimer = setInterval(() => { D.offerLeft--; if (D.offerLeft <= 0) { job.declined = true; closeOffer(); toast("Request expired."); } render(); }, 1000);

}

    case "a-set-del": { const t = A.draft.trucks[+arg]; if (A.draft.trucks.length === 1) { toast("Keep at least one truck type."); return; } A.draft.trucks.splice(+arg, 1); A.editTruck = null; toast(`${t.name || "Truck type"} removed. Tap Save changes to keep it that way.`); break; }
    case "a-set-undo": A.draft = toDraft(currentSettings()); A.setErr = ""; toast("Changes undone."); break;
    case "a-set-reset": A.draft = toDraft(DEFAULTS); A.setErr = ""; toast("Original settings loaded. Tap Save changes to use them."); break;
    case "a-set-save": {
      const r = fromDraft(A.draft);
      if (r.err) { A.setErr = r.err; render(); $(".full").scrollTop = 0; return; }
      const ok = saveSettings(r.st); syncState(); A.draft = toDraft(currentSettings()); A.setErr = "";
      toast(ok ? "Settings saved on this device." : "Settings are in use now, but this browser won't keep them after you close it.");
      break;
    }
    case "a-remind": toast("Reminder texted. If it expires, they can't take new jobs until it's renewed."); return;
    case "a-suspend": { const r = ROSTER.find(x => x.name === arg); r.status = r.status === "Suspended" ? "Approved" : "Suspended"; toast(r.status === "Suspended" ? `${arg} suspended. They can't take jobs.` : `${arg} reinstated.`); break; }
  }
  render();
}
function approveMe() { if (NEW.driver) NEW.driver.approved = true; if (ACCT.driver === "new") D.approved = true; }
function saveAf() { if (!AF) return; ACCT_FIELDS[AF.kind].forEach(([f]) => { const el = $("#af-" + f); if (el) AF[f] = el.value; }); }
function saveSu() {
  const s = D.signup; if (!s) return;
  ["name", "phone", "email", "city", "company", "years", "make", "model", "year", "plate", "cap", "vin", "mc"].forEach(k => { const el = $("#su-" + k); if (el) s[k] = k === "vin" ? el.value.toUpperCase() : el.value; });
  ["tarp", "terms", "mvr"].forEach(k => { const el = $("#su-" + k); if (el) s[k] = el.checked; });
  const dot = $("#su-dot"); if (dot) s.dotNum = dot.value;
  DOCS.forEach(([k]) => DOC_FIELDS[k].forEach(([f]) => { const el = $(`#sd-${k}-${f}`); if (el) s.det[k][f] = el.value; }));
}

document.addEventListener("click", e => {
  const m = e.target.closest("[data-mode]");
  if (m) { mode = m.dataset.mode === "welcome" ? null : m.dataset.mode; C.menu = D.menu = F.menu = A.menu = false; if (mode && mode !== "admin" && m.closest(".welcome")) { ACCT[mode] = null; AF = null; D.signup = null; } render(); return; }
  const a = e.target.closest("[data-act]");
  if (a && a.dataset.act.endsWith("menu-close") && e.target !== a) return;   // clicks inside the menu panel don't close it
  if (a && !(e.target.closest("label") && e.target.tagName === "INPUT")) { const [n, ...rest] = a.dataset.act.split(":"); act(n, rest.join(":")); }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("opt")) { e.preventDefault(); e.target.click(); } });
document.addEventListener("input", e => {
  if (e.target.id === "q") $("#results").innerHTML = placeList(e.target.value);
  if (e.target.id === "c-note") C.note = e.target.value;
  if (setDraft(e.target)) { const bar = $("#set-bar"); if (bar) bar.style.display = setDirty() ? "flex" : "none"; return; }
  if (e.target.closest && e.target.closest("[data-su]")) { saveSu(); const b = $("[data-act=su-next], [data-act=su-submit]"); if (b) b.disabled = !suValid(); }
  if (e.target.closest && e.target.closest("[data-af]")) { saveAf(); const b = $("[data-act=af-submit]"); if (b) b.disabled = !afValid(); }
});
document.addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.pick) { const id = e.target.dataset.pick; F.picked = e.target.checked ? [...F.picked, id] : F.picked.filter(x => x !== id); render(); return; }
  if (e.target.id === "ticket" && e.target.files[0]) { D.tickets.push(String(448800 + D.tickets.length * 13)); toast("Ticket saved. The contractor can see it."); render(); }
  if ((e.target.type === "checkbox" || e.target.tagName === "SELECT") && setDraft(e.target)) { render(); return; }
  if (e.target.id === "c-plant") { C.plant = +e.target.value; render(); return; }
  if (e.target.id === "c-time") { C.time = e.target.value; render(); return; }
  if (e.target.id === "c-hours") { C.hours = +e.target.value; render(); return; }
  if (e.target.dataset && e.target.dataset.mydoc && e.target.files[0]) { MYDOCS[2] = ["Insurance certificate", "New certificate sent for review", "ok"]; toast("Got it. We'll check it within a day."); render(); return; }
  const k = e.target.dataset && e.target.dataset.doc;
  if (k && e.target.files[0]) { saveSu(); D.signup.files[k] = e.target.files[0].name; if (SCAN[k]) D.signup.det[k] = { ...SCAN[k] }; render(); return; }
  if (e.target.closest && e.target.closest("[data-su]")) { saveSu(); if (["su-tarp", "su-terms", "su-mvr", "su-make", "su-years"].includes(e.target.id) || e.target.id.startsWith("sd-")) render(); }
});

drawBaseMap();
// On a computer the map fills the screen and the work area sits to the right of the panel
const wide = matchMedia("(min-width: 960px)");
function fitMap() {
  const m = $("#map");
  if (!wide.matches) { m.setAttribute("viewBox", "0 0 400 760"); m.setAttribute("preserveAspectRatio", "xMidYMid slice"); return; }
  const W = innerWidth, H = innerHeight, sc = (H - 64) / 700, cx = 488 + (W - 488) / 2;
  m.setAttribute("viewBox", `${(200 - cx / sc).toFixed(1)} ${(380 - (64 + (H - 64) / 2) / sc).toFixed(1)} ${(W / sc).toFixed(1)} ${(H / sc).toFixed(1)}`);
  m.setAttribute("preserveAspectRatio", "xMinYMin meet");
}
fitMap(); addEventListener("resize", fitMap);
if (["#driver", "#contractor", "#fleet", "#admin"].includes(location.hash)) mode = location.hash.slice(1);
render();
// Keep the map and ETAs moving
tick = setInterval(() => {
  if (job && (job.status === "searching" || job.status === "live")) {
    if (mode === "driver" && D.screen === "job" && !D.menu && !D.page && !D.signup) render();
    else if (((mode === "contractor" && (C.screen === "live" || C.screen === "searching")) || (mode === "fleet" && F.tab === "requests" && !F.picked.length)) && !document.activeElement?.matches("input, select")) render(); else drawMap();
  }
}, 1000);
</script>
